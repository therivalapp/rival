<div class="row" id="row"></div>
<script>
// Same drawing as drawCountdownStamp in src/lib/shareStamp.ts; only the number's colour differs.
const S = 3, SERIF = 'Georgia, "Times New Roman", serif', SANS = 'Manrope, -apple-system, system-ui, sans-serif';
function spaced(x, t, px, py, sp, center) { const ws = [...t].map(c => x.measureText(c).width); const tot = ws.reduce((a, b) => a + b, 0) + sp * (t.length - 1); let cx = center ? px - tot / 2 : px; x.textAlign = 'left'; [...t].forEach((c, i) => { x.fillText(c, cx, py); cx += ws[i] + sp; }); }
const tones = {
  gold: { top: '#fff4d6', bottom: '#ffc94d', label: '#ffd27a' },
  ivory: { top: '#ffffff', bottom: '#e8dcc4', label: '#f4ead8' },
};
function draw(tone, days, name, meta) {
  const t = tones[tone];
  const w = 260, c = document.createElement('canvas'); c.width = w * S; c.height = 172 * S;
  const x = c.getContext('2d'); x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 9 * S;
  const C = w / 2 * S; let y = 24 * S;
  x.font = `800 ${13 * S}px ${SANS}`; x.fillStyle = '#fff'; spaced(x, 'RIVAL', C, y, 13 * 0.4 * S, true);
  y += 62 * S; x.font = `italic 700 ${58 * S}px ${SERIF}`;
  const g = x.createLinearGradient(0, y - 52 * S, 0, y); g.addColorStop(0, t.top); g.addColorStop(1, t.bottom);
  x.fillStyle = g; x.textAlign = 'center'; x.fillText(String(days), C, y);
  y += 20 * S; x.font = `800 ${9 * S}px ${SANS}`; x.fillStyle = t.label; spaced(x, 'DAYS TO', C, y, 1.6 * S, true);
  y += 30 * S; x.font = `italic 700 ${22 * S}px ${SERIF}`; x.fillStyle = '#fff'; x.textAlign = 'center'; x.fillText(name, C, y);
  y += 20 * S; x.font = `800 ${8.5 * S}px ${SANS}`; x.fillStyle = 'rgba(255,255,255,0.78)'; spaced(x, meta, C, y, 1.3 * S, true);
  return c;
}
document.fonts.load('800 40px Manrope').finally(() => {
  const row = document.getElementById('row');
  [['gold', ''], ['ivory', ''], ['gold', 'b'], ['ivory', 'b']].forEach(([tone, cls]) => {
    const col = document.createElement('div'); col.className = 'col';
    const p = document.createElement('div'); p.className = 'photo ' + cls;
    p.appendChild(draw(tone, 24, 'Vancouver Half', 'RUN  ·  SUN, NOV 16'));
    const l = document.createElement('div'); l.className = 'label'; l.textContent = tone;
    col.append(p, l); row.appendChild(col);
  });
});
</script>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Newsreader:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121010;font-family:Manrope,sans-serif;color:#fff;padding:24px 16px;width:375px;box-sizing:border-box}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:22px 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.row{display:flex;background:#1d1714;border:1px solid rgba(255,209,190,.1);border-radius:18px;overflow:hidden}
.c{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;justify-content:center}
.c+.c{border-left:1px solid rgba(255,209,190,.08)}
.rank{background:linear-gradient(160deg,#a9bde8,#4f68ad);color:#1a1210;position:relative;justify-content:flex-start}
.ic{font-size:15px;line-height:16px}
.v{font-family:Newsreader,serif;font-style:italic;font-weight:700;font-size:26px;line-height:30px;margin-top:2px}
.gold{background:linear-gradient(180deg,#ffe6b0,#f5b759);-webkit-background-clip:text;color:transparent}
.n{font-weight:800;font-size:20px;line-height:24px;margin-top:4px}
.l{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:3px}
.rank .l{color:rgba(16,14,12,.7)}
.d{font-size:10.5px;font-weight:600;color:rgba(16,14,12,.6)}
.s{font-size:10.5px;font-weight:600;color:#ffb59e}
.big .v{font-size:34px;line-height:36px}.big .n{font-size:30px;line-height:34px;margin-top:0}
.rv{font-family:Newsreader,serif;font-style:italic;font-weight:700;font-size:18px;letter-spacing:1.4px;line-height:24px;margin-top:4px}
</style><style>
.v{font-size:32px}.n{font-family:Manrope;font-size:32px;line-height:30px;margin-top:2px;margin-bottom:-3px}
.c{padding:8px 2px;justify-content:flex-start}
.rank{justify-content:flex-start;overflow:hidden}
.mark{position:absolute;right:-14px;bottom:-16px;font-size:64px;color:rgba(16,14,12,.12);line-height:1}
.inset .rank{margin:6px 0;border-radius:12px;padding:2px 2px}
.inset .c+.c{border-left:0}
</style></head><body><h2>Now <span>full height</span></h2><div class="row "><div class="c"><div class="ic" style="color:#f5b759">⚡</div><div class="v gold">+23</div><div class="l">Effort today</div><div class="s">+186 this week</div></div>
<div class="c rank"><div class="mark">◆</div><div class="ic">◆</div><div class="rv">ELITE</div><div class="l">2026 rank</div><div class="d">75 days left</div></div>
<div class="c"><div class="ic" style="color:#e8835f">🔥</div><div class="n">1</div><div class="l">Week streak</div><div class="s">Week secured</div></div></div><h2>Card within a card <span>rounded, inset</span></h2><div class="row inset"><div class="c"><div class="ic" style="color:#f5b759">⚡</div><div class="v gold">+23</div><div class="l">Effort today</div><div class="s">+186 this week</div></div>
<div class="c rank"><div class="mark">◆</div><div class="ic">◆</div><div class="rv">ELITE</div><div class="l">2026 rank</div><div class="d">75 days left</div></div>
<div class="c"><div class="ic" style="color:#e8835f">🔥</div><div class="n">1</div><div class="l">Week streak</div><div class="s">Week secured</div></div></div></body></html>

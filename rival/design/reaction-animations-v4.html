<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Animations</title>
<style>
body{margin:0;background:#141210;color:#fff;font-family:-apple-system,Helvetica,sans-serif;padding:16px}
h1{font:italic 700 24px Georgia;margin:0 0 4px}p.s{color:rgba(255,255,255,.6);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;max-width:1100px}
.box{background:linear-gradient(160deg,#2b2522,#221d1b);border:1px solid rgba(255,181,158,.22);border-radius:16px;padding:14px 16px}
.h{font:800 11px Helvetica;letter-spacing:1.6px;color:#ffb59e}.d{font-size:12px;color:rgba(255,255,255,.55);margin:3px 0 14px;min-height:30px}
button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:rgba(255,255,255,.85);position:relative;padding:6px 4px}
button .ic{position:relative;width:22px;height:22px;display:inline-block}
button svg{width:22px;height:22px;display:block;overflow:visible}
.cnt{color:rgba(255,255,255,.4);font-weight:600}
.r.on .lab,.r.on .cnt{background:linear-gradient(135deg,#e8835f,#ffd0bd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.i.on .lab,.i.on .cnt{background:linear-gradient(180deg,#ffe6b0,#f5b759);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.p{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;pointer-events:none}
.ray{position:absolute;left:50%;top:50%;width:2px;height:8px;border-radius:2px;pointer-events:none;transform-origin:50% 100%}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.6)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:scale(.4) rotate(-180deg)}70%{transform:scale(1.3) rotate(15deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spinShine{0%{transform:scale(.4) rotate(-180deg);filter:none}65%{transform:scale(1.3) rotate(15deg);filter:brightness(1.6) drop-shadow(0 0 7px #ffd0bd)}100%{transform:scale(1) rotate(0);filter:none}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes fly{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--d)*-1)) scale(.2);opacity:0}}
@keyframes rays{0%{transform:translate(-50%,-100%) rotate(var(--a)) translateY(-6px) scaleY(.2);opacity:1}100%{transform:translate(-50%,-100%) rotate(var(--a)) translateY(-18px) scaleY(1);opacity:0}}
@keyframes flash{0%,100%{filter:none;transform:none}10%{filter:brightness(2.5) drop-shadow(0 0 8px #ffe6b0);transform:scale(1.35)}20%{filter:brightness(1)}30%{filter:brightness(2.5) drop-shadow(0 0 10px #ffe6b0);transform:scale(1.2)}55%{transform:scale(1)}}
@keyframes strike{0%{transform:translateY(-26px) scale(.7);opacity:0}35%{transform:translateY(2px) scale(1.15);opacity:1}50%{transform:translateY(0) scale(.95)}100%{transform:none}}
@keyframes flicker{0%,100%{opacity:1}15%{opacity:.2}25%{opacity:1}40%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(245,183,89,.0)}30%{box-shadow:0 0 18px 6px rgba(245,183,89,.55)}100%{box-shadow:0 0 0 0 rgba(245,183,89,0)}}
.halo{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
</style></head><body>
<h1>Respect and Inspired</h1>
<p class="s">Tap a button to play it, tap again to undo. Each one runs well under a second.</p>
<div class="grid" id="g"></div>
<script>
const STAR='M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
const BOLT='M13.5 2L5 13.5h6l-1.5 8.5L18 10.5h-6z';
const S_ON='#f4a98a',S_OFF='rgba(255,255,255,.85)',B_ON='#f5b759';
const opts=[
 ['r','STAR A. POP AND BURST','The star squeezes, pops, and throws out salmon sparks.','burst'],
 ['r','STAR B. SPIN IN','The star spins in from small, then a ring ripples out.','spin'],
 ['r','STAR C. POP AND SHINE','A quick pop with short light rays around it.','rays'],
 ['r','STAR D. SPIN AND SHINE','The star spins in from small, glows as it lands, then light rays shine out.','spinshine'],
 ['i','BOLT A. FLASH','The bolt flashes bright twice, like lightning, with a gold glow.','flash'],
 ['i','BOLT B. STRIKE','The bolt drops in from above and sends gold sparks off its tip.','strike'],
 ['i','BOLT C. FLICKER AND CHARGE','The bolt flickers on like a bulb, then a gold charge ring spreads out.','flicker'],
 ['i','BOLT D. FLASH AND CHARGE','The bolt flashes bright twice, then a gold charge ring spreads out.','flashcharge'],
 ['i','BOLT E. FLASH AND BOLT CHARGE','The bolt flashes bright twice, then a gold bolt outline spreads out from it.','flashbolt'],
];
const g=document.getElementById('g');
opts.forEach(([k,h,d,anim],i)=>{
 const r=k==='r';
 g.insertAdjacentHTML('beforeend',`<div class="box"><div class="h">${h}</div><div class="d">${d}</div><button class="${k}" data-a="${anim}" id="b${i}"><span class="ic"><svg viewBox="0 0 24 24"><path d="${r?STAR:BOLT}" fill="${r?'none':S_OFF}" stroke="${r?S_OFF:'none'}" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="lab">${r?'Respect':'Inspired'}</span><span class="cnt">0</span></button></div>`);
});
function particles(ic,color,n,dist,size){for(let j=0;j<n;j++){const p=document.createElement('span');p.className='p';p.style.background=color;p.style.width=p.style.height=size+'px';p.style.setProperty('--a',(j*360/n+Math.random()*20)+'deg');p.style.setProperty('--d',(dist+Math.random()*8)+'px');p.style.animation=`fly ${520+Math.random()*200}ms cubic-bezier(.2,.7,.3,1) forwards`;ic.appendChild(p);setTimeout(()=>p.remove(),900)}}
function boltRing(ic,color){const w=document.createElement('span');w.className='halo';w.style.width=w.style.height='22px';w.innerHTML=`<svg viewBox="0 0 24 24" style="width:22px;height:22px;overflow:visible"><path d="${BOLT}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;w.style.animation='ring 650ms ease-out forwards';ic.appendChild(w);setTimeout(()=>w.remove(),750)}
function ring(ic,color){const h=document.createElement('span');h.className='halo';h.style.border=`2px solid ${color}`;h.style.animation='ring 600ms ease-out forwards';ic.appendChild(h);setTimeout(()=>h.remove(),700)}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{
 const on=b.classList.toggle('on');const r=b.classList.contains('r');const path=b.querySelector('path');const svg=b.querySelector('svg');const ic=b.querySelector('.ic');
 b.querySelector('.cnt').textContent=on?1:0;
 if(r){path.setAttribute('fill',on?S_ON:'none');path.setAttribute('stroke',on?'none':S_OFF)}else{path.setAttribute('fill',on?B_ON:S_OFF)}
 svg.style.animation='none';void svg.offsetWidth;
 if(!on)return;
 const a=b.dataset.a;
 if(a==='burst'){svg.style.animation='pop 520ms cubic-bezier(.3,1.6,.5,1)';setTimeout(()=>particles(ic,S_ON,9,22,4),150)}
 if(a==='spin'){svg.style.animation='spin 600ms cubic-bezier(.3,1.4,.5,1)';setTimeout(()=>ring(ic,S_ON),250)}
 if(a==='rays'){svg.style.animation='pop 480ms cubic-bezier(.3,1.6,.5,1)';setTimeout(()=>{for(let j=0;j<8;j++){const y=document.createElement('span');y.className='ray';y.style.background=S_ON;y.style.setProperty('--a',(j*45)+'deg');y.style.animation='rays 450ms ease-out forwards';ic.appendChild(y);setTimeout(()=>y.remove(),500)}},140)}
 if(a==='spinshine'){svg.style.animation='spinShine 620ms cubic-bezier(.3,1.4,.5,1)';setTimeout(()=>{for(let j=0;j<8;j++){const y=document.createElement('span');y.className='ray';y.style.background=S_ON;y.style.setProperty('--a',(j*45)+'deg');y.style.animation='rays 480ms ease-out forwards';ic.appendChild(y);setTimeout(()=>y.remove(),520)}},380)}
 if(a==='flashcharge'){svg.style.animation='flash 700ms ease-out';setTimeout(()=>ring(ic,B_ON),300)}
 if(a==='flashbolt'){svg.style.animation='flash 700ms ease-out';setTimeout(()=>boltRing(ic,B_ON),300)}
 if(a==='flash'){svg.style.animation='flash 700ms ease-out'}
 if(a==='strike'){svg.style.animation='strike 520ms cubic-bezier(.3,1.3,.5,1)';setTimeout(()=>particles(ic,B_ON,7,18,3),190)}
 if(a==='flicker'){svg.style.animation='flicker 420ms linear';setTimeout(()=>ring(ic,B_ON),380)}
});
</script></body></html>

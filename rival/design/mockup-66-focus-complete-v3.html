<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mockup 66 · Personal Focus goal complete (2026-11-15). Today's real Focus
   card (home.tsx mFocusFree): serif title, FOCUS rule, 200px ring, meta row. */
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;width:1260px;padding-bottom:30px}
.top{font:italic 700 24px Georgia,serif;text-align:center;padding:18px 0 4px}
.sub{text-align:center;font-size:12.5px;color:rgba(255,255,255,.6);padding:0 40px 18px}
.row{display:flex;gap:24px;justify-content:center}
.col{width:375px}
.tag{font-size:12px;font-weight:800;letter-spacing:1.4px;color:#ffb59e}
.desc{font-size:12px;color:rgba(255,255,255,.65);margin:4px 0 10px;line-height:1.45;min-height:52px}
.ph{position:relative;width:375px;height:660px;border-radius:28px;overflow:hidden;background:#131313;padding:18px 16px;box-sizing:border-box}
.card{position:relative;border-radius:22px;border:1px solid rgba(255,255,255,.08);background:radial-gradient(120% 60% at 50% 0%,rgba(217,119,87,.16),rgba(40,40,40,0) 60%),#1e1d1c;padding:22px 16px 20px;text-align:center}
.t{font:italic 700 26px Georgia,serif}
.fl{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:2px;color:#ffb59e}
.fl i{display:block;width:34px;height:1px;background:rgba(255,181,158,.4)}
.ring{width:200px;height:200px;margin:16px auto 0;position:relative}
.ring svg{position:absolute;inset:0}
.ri{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font:italic 700 52px Georgia,serif;line-height:1}
.of{font-size:13px;color:rgba(255,255,255,.65);margin-top:6px}
.meta{display:flex;justify-content:center;margin-top:18px}
.mc{width:130px}.mc b{display:block;font:italic 700 26px Georgia,serif}.mc span{font-size:10.5px;font-weight:800;letter-spacing:2px;color:#ffb59e}
.dv{width:1px;background:rgba(255,181,158,.25)}
.badge{margin-top:16px;font-size:11px;font-weight:800;letter-spacing:1.4px;color:#FFD700}
.badge svg{width:14px;height:14px}
.line{font-size:13px;margin-top:10px;color:rgba(255,255,255,.85)}.line b{color:#FFD700}
.btn{display:inline-block;margin-top:16px;padding:11px 22px;border-radius:999px;background:linear-gradient(135deg,#D97757,#ffb59e);color:#2a1710;font-weight:800;font-size:13.5px}
.ghost{display:inline-block;margin-top:16px;margin-left:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,181,158,.4);color:#ffb59e;font-weight:800;font-size:13.5px}
.togo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.85)}
.strip{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,215,0,.22),rgba(255,215,0,.05) 70%);border:1px solid rgba(255,215,0,.55);border-top-color:rgba(255,244,184,.95);text-align:left}
.strip .k{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#FFD700}
.strip .n{font:italic 700 17px Georgia,serif;margin-top:1px}
.strip .v{margin-left:auto;font:italic 700 20px Georgia,serif;color:#ffe27a}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;width:7px;height:11px;border-radius:2px}
.nav{position:absolute;left:16px;right:16px;bottom:14px;height:52px;border-radius:26px;background:#1c1c1c;border:1px solid rgba(255,255,255,.08)}
.sheet{z-index:5;position:absolute;left:0;right:0;bottom:0;background:#282828;border-radius:24px 24px 0 0;padding:10px 16px 26px;text-align:left}.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 12px}.st{font:italic 700 20px Georgia,serif;margin-bottom:10px}.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,209,190,.05);border:1px solid rgba(255,181,158,.18);margin-top:8px}.on{font-size:14.5px;font-weight:800}.os{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}.plus{width:36px;height:36px;border-radius:18px;border:1px solid rgba(255,181,158,.5);color:#ffb59e;display:flex;align-items:center;justify-content:center;font-size:20px}</style></head><body>
<div class="top">Mockup 66 v3 · Focus goal complete, what stays</div>
<div class="sub">A, after the moment: the completed ring stays, with the next step depending on whether another Focus is lined up.</div>
<div class="row" id="r"></div>
<script>
const G='#FFD700',IV='#f4ead8';
const TICK='M53.6,109.6 L71.2,95.2 Q82.4,106.4 90.4,119.2 Q116,87.2 149.6,56.8 Q122.4,95.2 96.8,140 Q90.4,144.8 85.6,143.2 Q69.6,125.6 53.6,109.6 Z';
const ring=(pct,col,inner,s=200)=>`<div class="ring" style="width:${s}px;height:${s}px"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/><circle cx="100" cy="100" r="86" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="${540.35*pct} 541"/></svg>${inner}</div>`;
const tick=`<svg viewBox="0 0 200 200"><path d="${TICK}" fill="${IV}"/></svg>`;
const check='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD700"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#2a2200" stroke-width="2.4"/></svg>';
const head=(t)=>`<div class="t">${t}</div><div class="fl"><i></i>FOCUS<i></i></div>`;
const done=(extra)=>`<div class="card">${head('All activities')}${ring(1,G,tick)}<div class="badge">GOAL COMPLETE</div><div class="line"><b>150 km</b> · finished 12 days early</div>${extra}</div>`;
let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const cols=[G,'#ffb59e','#5edac7','#fff4b8','#D97757','#fff'];
const conf='<div class="conf">'+Array.from({length:60},(_,i)=>`<i style="left:${rnd()*360}px;top:${rnd()*620}px;background:${cols[i%6]};transform:rotate(${rnd()*360}deg)"></i>`).join('')+'</div>';
const next=`<div class="card">${head('Run 5 times')}${ring(0.4,'url(#x)','<div class="ri"><div class="big">2</div><div class="of">/ 5 activities</div></div>').replace('url(#x)','#e08a6b')}<div class="meta"><div class="mc"><b>40%</b><span>COMPLETE</span></div><div class="dv"></div><div class="mc"><b>9</b><span>DAYS LEFT</span></div></div></div>`;
const strip=`<div class="strip"><svg viewBox="0 0 200 200" width="40" height="40"><circle cx="100" cy="100" r="86" fill="none" stroke="${G}" stroke-width="16"/><path d="${TICK}" fill="${IV}"/></svg><div><div class="k">GOAL COMPLETE</div><div class="n">All activities</div></div><div class="v">150<span style="font:700 12px Manrope;color:rgba(255,255,255,.6)"> km</span></div></div>`;
const sheet=`<div style="position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.55)"></div><div class="sheet"><div class="grab"></div><div class="st">Next Focus</div>
<div class="opt"><svg viewBox="0 0 200 200" width="36" height="36"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="18"/><circle cx="100" cy="100" r="86" fill="none" stroke="#e08a6b" stroke-width="18" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="216 541"/></svg><div><div class="on">Run 5 times</div><div class="os">2 of 5 · 9 days left</div></div></div>
<div class="opt"><svg viewBox="0 0 200 200" width="36" height="36"><circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="18"/><circle cx="100" cy="100" r="86" fill="none" stroke="#e08a6b" stroke-width="18" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="97 541"/></svg><div><div class="on">Ride 200 km</div><div class="os">36 of 200 km · 20 days left</div></div></div>
<div class="opt new"><div class="plus">+</div><div><div class="on">Add a new Focus</div></div></div></div>`;
const P=[
 ['A · WITH OTHER FOCUSES','The win stays up to 3 days. Next Focus brings one of the others in now; after 3 days the next one comes in on its own.', done('<div><span class="btn">Next Focus</span></div>')],
 ['NEXT FOCUS','Pick which of the other Focuses takes the spot, or add a new one.', done('<div><span class="btn">Next Focus</span></div>')+sheet],
 ['A · NO OTHER FOCUS','Nothing lined up: the win stays until a new Focus is set.', done('<div><span class="btn">Set next Focus</span></div>')],
];
document.getElementById('r').innerHTML=P.map(([t,d,c])=>`<div class="col"><div class="tag">${t}</div><div class="desc">${d}</div><div class="ph">${c}<div class="nav"></div></div></div>`).join('');
</script></body></html>

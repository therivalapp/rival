<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share Light Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Copied from ActivityDiaryViewer's share sheet styles and StatTiles. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #141312; font-family: Manrope, system-ui, sans-serif; color: #fff; padding: 24px 16px; }
  .row { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cap { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.6); max-width: 375px; text-align: center; line-height: 1.4; }
  .cap b { color: #fff; }
  .phone { position: relative; width: 375px; height: 850px; border-radius: 34px; overflow: hidden; background: #232120;
    background-image: radial-gradient(ellipse 80% 260px at 50% 0%, rgba(217,119,87,0.16), rgba(217,119,87,0) 70%); background-repeat: no-repeat; }
  .back { position: absolute; left: 16px; top: 56px; width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; }
  .content { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 92px 20px 24px; }
  .stage { position: relative; width: 160px; height: 284px; border-radius: 18px; overflow: hidden; background: #2a2522 center/cover; }
  .stage canvas { position: absolute; left: 50%; transform: translateX(-50%); }
  .enlarge { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 15px; background: rgba(255,255,255,0.10); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; }
  .hint { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: -6px; }
  .below { align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .box { align-self: stretch; border-radius: 16px; border: 1px solid rgba(255,181,158,0.22); background: rgba(255,209,190,0.05); padding: 12px; }
  .choiceWrap { display: flex; flex-direction: column; gap: 8px; overflow: hidden; position: relative; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .kick { font-size: 10px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  /* The new Light/Dark switch: a small segment in the strip's own header. */
  .seg { display: flex; border: 1px solid rgba(255,181,158,0.22); border-radius: 999px; padding: 2px; }
  .seg span { font-size: 10.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; color: rgba(255,255,255,0.5); }
  .seg span.on { background: rgba(255,181,158,0.14); color: #ffb59e; }
  .strip { display: flex; gap: 8px; overflow: hidden; }
  .choice { flex: none; width: 52px; height: 72px; border-radius: 10px; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; padding: 4px; background: rgba(255,209,190,0.06); }
  .choice.on { border-color: #ffb59e; }
  .dark .choice:not(.card) { background: rgba(244,234,216,0.82); }
  .dark .choice.event .elabel { color: #4a3c28; }
  .choice img { max-width: 100%; max-height: 100%; }
  .choice.card { padding: 0; background: #2a2522 center/cover; }
  .choice.event { background: rgba(244,234,216,0.09); border-color: rgba(244,234,216,0.3); flex-direction: column; gap: 2px; padding: 4px 4px 5px; }
  .choice.event.on { border-color: #ffb59e; }
  .choice.event img { flex: 1; min-height: 0; }
  .elabel { font-size: 7.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #f4ead8; }
  .fade { position: absolute; top: 0; bottom: 0; right: 0; width: 36px; background: linear-gradient(90deg, rgba(46,42,40,0), rgb(46,42,40)); }
  .stats { display: flex; flex-direction: column; gap: 7px; }
  .grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .tile { width: 23%; flex-grow: 1; max-width: 24%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255,181,158,0.22); background: rgba(255,209,190,0.05); }
  .tile .v { font-family: Georgia, serif; font-style: italic; font-weight: 700; font-size: 15px; line-height: 18px; color: rgba(255,255,255,0.6); }
  .tile .v small { font-family: Manrope; font-style: normal; font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.4); }
  .tile .l { font-size: 8.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.45); }
  .tile.on { border-color: transparent; background: linear-gradient(135deg, #D97757 0%, #ffb59e 100%); }
  .tile.on .v { color: #2a120a; } .tile.on .v small { color: rgba(42,18,10,0.65); } .tile.on .l { color: rgba(42,18,10,0.7); }
  .tile.gold { border-color: transparent; background: linear-gradient(160deg, #fff0b0 0%, #f5c76a 45%, #c4932a 100%); }
  .tile.gold .v { color: #3a2600; } .tile.gold .l { color: rgba(58,38,0,0.75); }
  .eventBox { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 152px; }
  .chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 7px; border-radius: 999px; padding: 7px 14px; border: 1px solid rgba(255,255,255,0.14); font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.7); }
  .chip.on { border-color: #ffb59e; background: rgba(255,181,158,0.1); color: #fff; }
  .dot { width: 10px; height: 10px; border-radius: 5px; }
  .note { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; }
  .share { align-self: stretch; min-height: 54px; border-radius: 999px; background: linear-gradient(135deg, #D97757 0%, #ffb59e 100%); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 16.5px; font-weight: 800; color: #5c1902; }
  .link { font-size: 13.5px; font-weight: 700; color: #ffb59e; margin-top: -4px; }
</style></head><body>

const S = 3, SERIF = 'Georgia, "Times New Roman", serif', SANS = 'Manrope, -apple-system, system-ui, sans-serif';
function spaced(x, t, px, py, sp, center) { const ws = [...t].map(c => x.measureText(c).width); const tot = ws.reduce((a, b) => a + b, 0) + sp * (t.length - 1); let cx = center ? px - tot / 2 : px; x.textAlign = 'left'; [...t].forEach((c, i) => { x.fillText(c, cx, py); cx += ws[i] + sp; }); }
// Light = today's stamps. Dark = near-black type with a soft light halo, deep gold for Effort.
const MODES = {
  light: { ink: '#ffffff', sub: 'rgba(255,255,255,0.78)', shadow: 'rgba(0,0,0,0.6)', goldTop: '#fff4d6', goldBot: '#ffc94d', goldLabel: '#ffd27a', ivTop: '#ffffff', ivBot: '#e8dcc4', ivLabel: '#f4ead8', rule: 'rgba(255,255,255,0.6)' },
  dark:  { ink: '#1b1714', sub: 'rgba(27,23,20,0.75)', shadow: 'rgba(255,255,255,0.55)', goldTop: '#1b1714', goldBot: '#1b1714', goldLabel: 'rgba(27,23,20,0.75)', ivTop: '#1b1714', ivBot: '#1b1714', ivLabel: 'rgba(27,23,20,0.75)', rule: 'rgba(27,23,20,0.5)' },
};
function cv(w, h, m) { const c = document.createElement('canvas'); c.width = w * S; c.height = h * S; const x = c.getContext('2d'); x.shadowColor = m.shadow; x.shadowBlur = 9 * S; return [c, x]; }
function grad(x, a, b, t, btm) { const g = x.createLinearGradient(0, t, 0, btm); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function rival(x, m, C, y, size) { x.font = `800 ${size * S}px ${SANS}`; x.fillStyle = m.ink; spaced(x, 'RIVAL', C, y, size * 0.4 * S, true); }
// Stamp A2: RIVAL centred, a row of figures, Effort last.
function stampA2(mode) {
  const m = MODES[mode]; const figs = [['12.4', 'km', 'Distance'], ['1:02:15', '', 'Time'], ['5:01', '/km', 'Pace'], ['86.2', '', 'Effort', 1]];
  const cw = 82, n = figs.length, w = n * cw + 30; const [c, x] = cv(w, 86, m); const C = w / 2 * S;
  rival(x, m, C, 24 * S, 13); const y = 50 * S;
  figs.forEach(([v, u, l, g], i) => {
    const fx = C + (i - (n - 1) / 2) * cw * S;
    if (i) { const b = x.shadowBlur; x.shadowBlur = 4 * S; x.fillStyle = m.rule; x.fillRect(fx - cw / 2 * S, y - 19 * S, 2, 19 * 1.55 * S); x.shadowBlur = b; }
    x.font = `italic 700 ${19 * S}px ${SERIF}`; const vw = x.measureText(v).width;
    x.font = `600 ${19 * 0.45 * S}px ${SANS}`; const uw = u ? x.measureText(' ' + u).width : 0;
    const st = fx - (vw + uw) / 2; x.font = `italic 700 ${19 * S}px ${SERIF}`;
    x.fillStyle = g ? grad(x, m.goldTop, m.goldBot, y - 19 * S, y) : m.ink; x.textAlign = 'left'; x.fillText(v, st, y);
    if (u) { x.font = `600 ${19 * 0.45 * S}px ${SANS}`; x.fillStyle = m.sub; x.fillText(' ' + u, st + vw, y); }
    x.font = `800 ${8.5 * S}px ${SANS}`; x.fillStyle = g ? m.goldLabel : m.sub; spaced(x, l.toUpperCase(), fx, y + 14 * S, 1.3 * S, true);
  });
  return c;
}
function countdown(mode, tone) {
  const m = MODES[mode]; const w = 260; const [c, x] = cv(w, 172, m); const C = w / 2 * S; let y = 24 * S;
  rival(x, m, C, y, 13); y += 62 * S;
  x.font = `italic 700 ${58 * S}px ${SERIF}`;
  x.fillStyle = tone === 'gold' ? grad(x, m.goldTop, m.goldBot, y - 52 * S, y) : grad(x, m.ivTop, m.ivBot, y - 52 * S, y);
  x.textAlign = 'center'; x.fillText('24', C, y); y += 20 * S;
  x.font = `800 ${9 * S}px ${SANS}`; x.fillStyle = tone === 'gold' ? m.goldLabel : m.ivLabel; spaced(x, 'DAYS TO', C, y, 1.6 * S, true);
  y += 30 * S; x.font = `italic 700 ${22 * S}px ${SERIF}`; x.fillStyle = m.ink; x.textAlign = 'center'; x.fillText('Vancouver Half', C, y);
  y += 20 * S; x.font = `800 ${8.5 * S}px ${SANS}`; x.fillStyle = m.sub; spaced(x, 'RUN  ·  SUN, NOV 16', C, y, 1.3 * S, true);
  return c;
}
const url = (c) => c.toDataURL();
const backSvg = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const enlargeSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="rgba(255,255,255,0.6)"><path d="M21 11V3h-8l3.29 3.29-10 10L3 13v8h8l-3.29-3.29 10-10z"/></svg>';
const shareSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#5c1902"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';

function phone({ mode, pick, tone, cap }) {
  const stamp = pick === 'event' ? countdown(mode, tone) : stampA2(mode);
  const dw = pick === 'event' ? 100 : 148; // drawn width on the stage
  const top = pick === 'event' ? 28 : 222;
  const strip = [
    `<div class="choice card" style="background-image:url(${PHOTO})"></div>`,
    `<div class="choice event ${pick === 'event' ? 'on' : ''}"><img src="${url(countdown(mode, tone))}"><span class="elabel">Event</span></div>`,
    ...[0, 1, 2, 3, 4].map(i => `<div class="choice ${pick === 'stamp' && i === 0 ? 'on' : ''}"><img src="${url(stampA2(mode))}"></div>`),
  ].join('');
  const lower = pick === 'event'
    ? `<div class="box eventBox">
         <div class="chips" style="${mode === 'dark' ? 'display:none' : ''}">
           <div class="chip ${tone === 'gold' && mode === 'light' ? 'on' : ''}" style="${mode === 'dark' ? 'opacity:0.35' : ''}"><span class="dot" style="background:#ffc94d"></span>Gold</div>
           <div class="chip ${tone === 'ivory' && mode === 'light' ? 'on' : ''}" style="${mode === 'dark' ? 'opacity:0.35' : ''}"><span class="dot" style="background:#f4ead8"></span>Ivory</div>
         </div>
         <div class="note">${mode === 'dark' ? 'Dark stamps are one colour.' : 'Countdown to Vancouver Half'}</div>
       </div>`
    : `<div class="box stats"><span class="kick">Select up to 3</span><div class="grid">
         ${[['12.4', 'km', 'Distance', 1], ['1:02:15', '', 'Time', 1], ['5:01', '/km', 'Pace', 1], ['4.6', 'km/h', 'Speed'], ['184', 'm', 'Elevation'], ['152', 'bpm', 'Heart rate'], ['640', '', 'Calories']]
           .map(([v, u, l, on]) => `<div class="tile ${on ? 'on' : ''}"><span class="v">${v}${u ? `<small> ${u}</small>` : ''}</span><span class="l">${l}</span></div>`).join('')}
         <div class="tile gold"><span class="v">86.2</span><span class="l">Effort</span></div>
       </div></div>`;
  return `<div class="col"><div class="phone ${mode}">
    <div class="back">${backSvg}</div>
    <div class="content">
      <div class="stage" style="background-image:url(${PHOTO})">
        <img src="${url(stamp)}" style="position:absolute;left:50%;transform:translateX(-50%);top:${top}px;width:${dw}px">
        <div class="enlarge">${enlargeSvg}</div>
      </div>
      <span class="hint">Drag to move</span>
      <div class="below">
        <div class="box choiceWrap">
          <div class="head"><span class="kick">Swipe for more</span>
            <div class="seg"><span class="${mode === 'light' ? 'on' : ''}">Light</span><span class="${mode === 'dark' ? 'on' : ''}">Dark</span></div>
          </div>
          <div class="strip">${strip}</div>
          <div class="fade"></div>
        </div>
        ${lower}
        <div class="share">${shareSvg}Share</div>
        <span class="link">Share the stamp on its own</span>
      </div>
    </div>
  </div><div class="cap">${cap}</div></div>`;
}
document.fonts.load('800 40px Manrope').finally(() => {
  document.getElementById('row').innerHTML = [
    phone({ mode: 'light', pick: 'stamp', tone: 'gold', cap: '<b>1. Light</b> (today). White on a bright photo fades.' }),
    phone({ mode: 'dark', pick: 'stamp', tone: 'gold', cap: '<b>2. Dark.</b> One colour, no gold: Effort is marked by its label, like the other figures.' }),
    phone({ mode: 'light', pick: 'event', tone: 'gold', cap: '<b>3. Countdown.</b> Gold or Ivory in its box, where the stats sit for the other stamps.' }),
    phone({ mode: 'dark', pick: 'event', tone: 'gold', cap: '<b>4. Countdown, Dark.</b> Gold and Ivory are light colours, so Dark hides the choice.' }),
  ].join('');
});

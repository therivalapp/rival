<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px;display:flex;flex-wrap:wrap;gap:28px 22px;width:1290px}
.col{width:300px}h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.ph{width:300px;height:534px;border-radius:20px;overflow:hidden;position:relative;background:url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/ridge-runners-hazy-backlit.png) center/cover}
.ph.b2{background-image:url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/a-single-runner-crossing-a-vast.png)}
.chk{width:300px;height:250px;border-radius:14px;margin-top:12px;background-color:#ddd;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:flex;align-items:center;justify-content:center}
.ph img{position:absolute}.chk img{max-width:270px;max-height:230px}
</style></head><body>
<script>
const SERIF='Georgia, serif',SANS='Manrope, sans-serif',S=2.4;
const figs=[['7.1','km','DISTANCE'],['43:13','','TIME'],['6:05','/km','PACE']];
function mk(w,h,draw){const c=document.createElement('canvas');c.width=w*S;c.height=h*S;const x=c.getContext('2d');x.shadowColor='rgba(0,0,0,0.6)';x.shadowBlur=9*S;x.textBaseline='alphabetic';draw(x);return c.toDataURL();}
const sp=(x,t,px,py,s,center)=>{const ws=[...t].map(c=>x.measureText(c).width);const tot=ws.reduce((a,b)=>a+b,0)+s*(t.length-1);let cx=center?px-tot/2:px;x.textAlign='left';[...t].forEach((c,i)=>{x.fillText(c,cx,py);cx+=ws[i]+s;});};
const gold=(x,t,b)=>{const g=x.createLinearGradient(0,t,0,b);g.addColorStop(0,'#fff4d6');g.addColorStop(1,'#ffc94d');return g;};
const fig=(x,f,fx,y,size,center)=>{x.font=`italic 700 ${size*S}px ${SERIF}`;const vw=x.measureText(f[0]).width;x.font=`600 ${size*0.45*S}px ${SANS}`;const uw=f[1]?x.measureText(' '+f[1]).width:0;const start=center?fx-(vw+uw)/2:fx;
 x.font=`italic 700 ${size*S}px ${SERIF}`;x.fillStyle=f[3]?gold(x,y-size*S,y):'#fff';x.textAlign='left';x.fillText(f[0],start,y);if(f[1]){x.font=`600 ${size*0.45*S}px ${SANS}`;x.fillStyle='rgba(255,255,255,0.78)';x.fillText(' '+f[1],start+vw,y);}
 x.font=`800 ${8.5*S}px ${SANS}`;x.fillStyle=f[3]?'#ffd27a':'rgba(255,255,255,0.78)';sp(x,f[2],center?fx:fx,y+14*S,1.3*S,center);};
const line=(x,px,py,h)=>{const sb=x.shadowBlur;x.shadowBlur=0;x.fillStyle='rgba(255,209,190,0.4)';x.fillRect(px,py,Math.max(1,S*0.5),h);x.shadowBlur=sb;};
// A: left block, name + row + effort
const A=mk(300,190,x=>{const L=14*S;let y=24*S;x.font=`800 ${13*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',L,y,5*S);
 y+=36*S;x.font=`italic 700 ${28*S}px ${SERIF}`;x.fillStyle='#fff';x.fillText('Sunset ridge run',L,y);
 y+=48*S;figs.forEach((f,i)=>{const fx=L+i*88*S;if(i)line(x,fx-10*S,y-24*S,38*S);fig(x,f,fx,y,24,false);});
 y+=46*S;fig(x,['68','','EFFORT',1],L,y,24,false);});
// B: centred
const B=mk(300,200,x=>{const C=150*S;let y=24*S;x.font=`800 ${13*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',C,y,5*S,true);
 y+=38*S;x.font=`italic 700 ${26*S}px ${SERIF}`;x.fillStyle='#fff';x.textAlign='center';x.fillText('Sunset ridge run',C,y);
 y+=48*S;const all=[...figs,['68','','EFFORT',1]];const cw=70*S;all.forEach((f,i)=>{const fx=C+(i-1.5)*cw;if(i)line(x,fx-cw/2,y-20*S,34*S);fig(x,f,fx,y,17,true);});});
// C: tall stack, no name
const Cc=mk(170,300,x=>{const L=12*S;let y=36*S;const st=[['7.1','km','DISTANCE'],['43:13','','TIME'],['6:05','/km','PACE'],['68','','EFFORT',1]];
 st.forEach(f=>{fig(x,f,L,y,32,false);y+=62*S;});x.font=`800 ${14*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',L,y-14*S,5.5*S);});
// D: Effort hero
const D=mk(300,170,x=>{const L=14*S;let y=58*S;x.font=`italic 700 ${56*S}px ${SERIF}`;x.fillStyle=gold(x,y-48*S,y);x.textAlign='left';x.fillText('68',L,y);const w=x.measureText('68').width;
 x.font=`800 ${10*S}px ${SANS}`;x.fillStyle='#ffd27a';sp(x,'EFFORT',L+w+10*S,y-6*S,1.6*S);
 y+=30*S;x.font=`600 ${13*S}px ${SANS}`;x.fillStyle='#fff';x.fillText('7.1 km   ·   43:13   ·   6:05 /km',L,y);
 y+=24*S;x.font=`italic 700 ${16*S}px ${SERIF}`;x.fillStyle='rgba(255,255,255,0.92)';x.fillText('Sunset ridge run',L,y);
 y+=28*S;x.font=`800 ${12*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',L,y,5*S);});

// E: one row of figures, RIVAL under
const E=mk(300,110,x=>{const L=14*S;let y=40*S;figs.forEach((f,i)=>{const fx=L+i*92*S;if(i)line(x,fx-10*S,y-24*S,38*S);fig(x,f,fx,y,26,false);});
 y+=46*S;x.font=`800 ${13*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',L,y,5*S);});
// F: one quiet line
const F=mk(300,80,x=>{const C=150*S;let y=34*S;x.font=`700 ${15*S}px ${SANS}`;x.fillStyle='#fff';x.textAlign='center';x.fillText('7.1 km   ·   43:13   ·   6:05 /km',C,y);
 y+=30*S;x.font=`800 ${12*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',C,y,5*S,true);});
// G: labels above, plain sans, centred column
const G=mk(160,280,x=>{const C=80*S;let y=26*S;const st=[['DISTANCE','7.1 km'],['TIME','43:13'],['PACE','6:05 /km']];
 st.forEach(([l,v])=>{x.font=`800 ${9*S}px ${SANS}`;x.fillStyle='rgba(255,255,255,0.8)';sp(x,l,C,y,1.6*S,true);y+=30*S;x.font=`700 ${26*S}px ${SANS}`;x.fillStyle='#fff';x.textAlign='center';x.fillText(v,C,y);y+=38*S;});
 y+=4*S;x.font=`800 ${14*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',C,y,5.5*S,true);});
const cols=[
 ['E · One row','',E,'left:8px;bottom:30px;width:286px','Three figures in a row, RIVAL under them. Nothing else.'],
 ['F · One line','',F,'left:10px;bottom:40px;width:280px','The figures as one plain line with RIVAL below, centred. The quietest; reads like a caption.'],
 ['G · Labels on top','',G,'left:70px;bottom:30px;width:160px','A centred column, each label over its figure in plain type, RIVAL at the foot.'],
 ['A · Name and figures','',A,'left:8px;bottom:24px;width:286px','The last version without the activity and date: RIVAL, the name, three figures in a row, Effort in gold below.'],
 ['B · Centred','',B,'left:8px;bottom:40px;width:286px','Everything centred, Effort joins the row as a fourth figure. Sits well in the middle of a photo or under a person.'],
 ['C · Tall stack','',Cc,'left:14px;bottom:22px;width:150px','No name, just the figures stacked large with RIVAL under them. Narrow, so it tucks into a corner and leaves the photo open.'],
 ['D · Effort first','b2',D,'left:8px;bottom:26px;width:286px','Effort leads, large in gold; the figures follow as one quiet line, then the name and RIVAL. The most RIVAL of the four.'],
];
document.write(cols.map(([t,cl,src,pos,n])=>`<div class="col"><h2>${t}</h2><div class="ph ${cl}"><img src="${src}" style="${pos}"></div><div class="chk"><img src="${src}"></div><div class="note">${n}</div></div>`).join(''));
</script></body></html>

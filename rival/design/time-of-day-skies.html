<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time of Day Skies</title>
<style>
:root{color-scheme:dark;--bg:#0e0c0b;--accent:#ffb59e;--muted:rgba(255,255,255,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px 16px 60px}
h1{font:italic 700 26px Georgia,serif;text-align:center;margin:0 0 4px}
h2{font:italic 700 20px Georgia,serif;margin:34px auto 12px;max-width:1100px}
.lead{color:var(--muted);text-align:center;margin:0 auto 24px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;max-width:1100px;margin:0 auto}
.lab{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.lab span{color:var(--muted);letter-spacing:.5px;text-transform:none;font-weight:500}
/* skies */
.sky{position:relative;overflow:hidden}
.sky:before{content:"";position:absolute;inset:0;background:var(--glow)}
.night{background:linear-gradient(180deg,#0d1424 0%,#1a2238 60%,#2a2a3c 100%);--glow:radial-gradient(ellipse 90% 50% at 50% 115%,rgba(120,130,190,.22),transparent 70%)}
.dawn{background:linear-gradient(180deg,#1f2c4a 0%,#4a4766 45%,#b07a74 80%,#d9a07e 100%);--glow:radial-gradient(ellipse 80% 45% at 50% 110%,rgba(255,190,140,.35),transparent 70%)}
.morning{background:linear-gradient(180deg,#4f7391 0%,#7f9cb0 50%,#c8b294 100%);--glow:radial-gradient(ellipse 80% 50% at 30% 105%,rgba(255,230,180,.25),transparent 70%)}
.midday{background:linear-gradient(180deg,#3f6f93 0%,#6f9bb8 55%,#a9c2cf 100%);--glow:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(255,255,255,.18),transparent 70%)}
.golden{background:linear-gradient(180deg,#5b5f7d 0%,#a7786a 50%,#e0a46a 100%);--glow:radial-gradient(ellipse 80% 50% at 70% 110%,rgba(255,200,120,.35),transparent 70%)}
.dusk{background:linear-gradient(180deg,#2a2347 0%,#5d3a5e 45%,#b05e57 82%,#d98a5c 100%);--glow:radial-gradient(ellipse 85% 45% at 50% 112%,rgba(255,150,100,.32),transparent 70%)}
.dim:after{content:"";position:absolute;inset:0;background:rgba(20,14,10,.28)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 33% 9%,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 58% 24%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.55),transparent),radial-gradient(1px 1px at 88% 34%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 22% 40%,rgba(255,255,255,.35),transparent)}
.icon{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;opacity:.16;z-index:1}
.icon path{fill:#fff}
.cap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:italic 600 15px Georgia,serif;color:rgba(255,255,255,.88);z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.35)}
/* feed card */
.card{background:linear-gradient(180deg,#30261f,#211a16);border:1px solid rgba(255,181,158,.16);border-left:3px solid #c97a5c;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#d7c9b8,#6c5a4a)}
.nm{font:italic 700 16px Georgia,serif}.sub{font-size:11.5px;color:var(--muted)}.sub b{color:var(--accent);font-weight:600}
.ttl{font:italic 700 19px Georgia,serif}
.ph{height:150px;border-radius:14px}
.stats{background:#36302b;border:1px solid rgba(255,255,255,.08);border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 2px;text-align:center}
.stats div+div{border-left:1px solid rgba(255,255,255,.08)}
.stats span{display:block;font-size:8px;letter-spacing:1.2px;color:var(--muted);font-weight:800}
.stats b{display:block;font-size:15px;margin-top:2px}
.stats .e b{font:italic 700 18px Georgia,serif;background:linear-gradient(#fff4d6,#ffc94d);-webkit-background-clip:text;background-clip:text;color:transparent}
/* day cards */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.day{height:210px;border-radius:16px}
.day .dn{position:absolute;top:10px;left:0;right:0;text-align:center;font:italic 600 15px Georgia,serif;z-index:2;color:rgba(255,255,255,.9)}
.day .bt{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end}
.day .bt small{display:block;font-size:12px;color:#ffc2a8;font-weight:600}
.day .bt b{font:italic 700 19px Georgia,serif}
.day .bt .e{text-align:right}.day .bt .e small{font-size:8.5px;letter-spacing:1.4px;color:#ffd27a}
.day .icon{width:110px;height:110px;margin:-55px 0 0 -55px}
.day:after{background:linear-gradient(transparent 45%,rgba(0,0,0,.45))!important}
</style></head><body>
<h1>Time-of-day skies</h1>
<p class="lead">An activity without a photo gets a soft sky for the hour it started. Kept muted and slightly dimmed, so a real photo still stands out next to it.</p>
<div class="grid" id="feed"></div>
<h2>Day cards in the Activity tab</h2>
<div class="days" id="days"></div>
<script>
const ICON={
 run:'M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z',
 ride:'M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z',
 walk:'M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7',
};
const S=[
 ['dawn','Dawn','5–8 am','run','Morning Run','6:02 am'],
 ['morning','Morning','8–11 am','ride','Morning Ride','9:40 am'],
 ['midday','Midday','11 am–3 pm','walk','Lunch Walk','12:15 pm'],
 ['golden','Late afternoon','3–6 pm','run','Afternoon Run','4:50 pm'],
 ['dusk','Dusk','6–9 pm','ride','Evening Ride','7:35 pm'],
 ['night','Night','9 pm–5 am','run','Night Run','10:20 pm'],
];
const art=(k,ic,big=true)=>`${k==='night'?'<div class="stars"></div>':''}<svg class="icon" viewBox="0 0 24 24"><path d="${ICON[ic]}"/></svg>`;
document.getElementById('feed').innerHTML=S.map(([k,n,h,ic,t,at])=>`<div><div class="lab">${n}<span>${h}</span></div><div class="card"><div class="hd"><div class="av"></div><div><div class="nm">Sandy</div><div class="sub">${at} · <b>The Hidden Leaf</b></div></div></div><div class="ttl">${t}</div>
<div class="ph sky dim ${k}">${art(k,ic)}<div class="cap">No photo this time, still counts.</div></div>
<div class="stats"><div><span>TIME</span><b>32:10</b></div><div><span>DISTANCE</span><b>5.4 km</b></div><div><span>CLIMB</span><b>48 m</b></div><div class="e"><span>EFFORT</span><b>52.4</b></div></div></div></div>`).join('');
const D=['Wednesday','Thursday','Friday','Saturday','Sunday','Monday'];
document.getElementById('days').innerHTML=S.map(([k,n,h,ic],i)=>`<div class="day sky dim ${k}">${art(k,ic)}<div class="dn">${D[i]}</div><div class="bt"><div><small>${['Run','Ride','Walk','Run','Ride','Run'][i]}</small><b>${['5.0','31.4','4.2','8.1','24.0','6.3'][i]} km</b></div><div class="e"><small>EFFORT</small><b style="background:linear-gradient(#fff4d6,#ffc94d);-webkit-background-clip:text;background-clip:text;color:transparent">${['49','88','22','71','64','55'][i]}</b></div></div></div>`).join('');
</script>
</body></html>

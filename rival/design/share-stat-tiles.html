<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px;display:flex;gap:28px;justify-content:center}
.col{width:375px}h2{font-size:11px;letter-spacing:2px;color:#ffb59e;margin:0 4px 10px;font-weight:800}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.ov{width:375px;border-radius:28px;background:#0f0d0c;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 20px 26px;box-sizing:border-box}
.stage{width:200px;height:356px;border-radius:16px;background:url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/a-small-peloton-of-cyclists-on-a.png) center/cover}
.strip{display:flex;gap:7px}.ch{width:34px;height:48px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);background:#3a3330}.ch.on{border-color:#ffb59e}
.lab{font-size:10px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.5);align-self:flex-start;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-self:stretch}
.t{position:relative;border-radius:12px;padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid rgba(255,181,158,.22);background:rgba(255,209,190,.05);overflow:hidden}
.t .v{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:15px;line-height:18px;color:rgba(255,255,255,.55);white-space:nowrap}
.t .u{font-family:Manrope;font-style:normal;font-size:9px;font-weight:600;color:rgba(255,255,255,.4)}
.t .l{font-size:8.5px;font-weight:800;letter-spacing:1px;color:rgba(255,255,255,.45);text-transform:uppercase}
.t.on{background:linear-gradient(135deg,#ffb59e,#D97757);border-color:transparent}
.t.on .v{color:#2a120a}.t.on .u{color:rgba(42,18,10,.65)}.t.on .l{color:rgba(42,18,10,.75)}
.t.gold{background:linear-gradient(160deg,#fff0b0 0%,#f5c76a 45%,#c4932a 100%);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.t.gold .v{color:#3a2600}.t.gold .l{color:rgba(58,38,0,.75)}
.t.full{opacity:.4}
.sub{font-size:10px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.35);align-self:flex-start;margin-top:2px}
.btn{align-self:stretch;padding:13px 0;border-radius:999px;text-align:center;font-weight:800;font-size:14.5px;color:#2a120a;background:linear-gradient(135deg,#ffb59e,#D97757);margin-top:4px}
</style></head><body>
<script>
const main=[['162','km','Distance',1],['5:48:10','','Time',1],['27.9','km/h','Speed',1],['2:09','/km','Pace'],['1,840','m','Elevation']];
const more=[['142','bpm','Heart rate'],['171','bpm','Max HR'],['84','rpm','Cadence'],['198','W','Power'],['3,120','','Calories'],['59.0','km/h','Max speed']];
const tile=([v,u,l,on],full)=>`<div class="t ${on?'on':full?'full':''}"><div class="v">${v}${u?`<span class="u"> ${u}</span>`:''}</div><div class="l">${l}</div></div>`;
const effort=`<div class="t gold"><div class="v">301</div><div class="l">Effort</div></div>`;
document.write(`<div class="col"><h2>STAT TILES · RIDE</h2><div class="ov"><div class="stage"></div><div class="strip">${'<div class="ch"></div>'.repeat(1)}<div class="ch on"></div>${'<div class="ch"></div>'.repeat(6)}</div>
<div class="lab">SHOW UP TO 3, PLUS EFFORT</div><div class="grid">${main.map(t=>tile(t,true)).join('')}${effort}</div>
<div class="sub">MORE FROM STRAVA</div><div class="grid">${more.map(t=>tile(t,true)).join('')}</div><div class="btn">Share</div></div>
<div class="note">Each stat is a mini tile showing its real figure, so you can see what you are choosing. Chosen ones are lit peach; Effort is the gold tile and always on. Once three are chosen the rest fade.</div></div>`);
</script></body></html>

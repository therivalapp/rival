<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* scan-workout.tsx saved state: successBanner + enhanceCta (real copy:
   "<name> saved with N Effort.", "Enhance photo with AI", "Done").
   Page = GREY_PAGE_BG + GreyPageHead; cards = RivalGhost; badge = GreyTiles
   round gradient badge; Effort figure = feed band gold (fcStats). */
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.col{width:375px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.page{background:#232120;border-radius:18px;padding:0 16px 22px;position:relative;overflow:hidden;min-height:470px}
.page::before{content:'';position:absolute;left:0;right:0;top:0;height:200px;background:radial-gradient(ellipse 80% 100% at 50% 0%,rgba(217,119,87,.16),rgba(217,119,87,0) 70%)}
.head{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 0 14px}
.back{position:absolute;left:0;top:16px;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,209,190,.06)}
.kick{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:#ffb59e}
.ttl{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:26px;margin-top:4px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.gold{background:linear-gradient(180deg,#ffe6b0,#f5b759);-webkit-background-clip:text;color:transparent}
.btn{padding:14px 0;border-radius:999px;text-align:center;font-weight:800;font-size:15px;color:#2a120a;background:linear-gradient(135deg,#ffb59e,#D97757);display:flex;justify-content:center;align-items:center;gap:8px}
.done{text-align:center;color:#ffb59e;font-weight:700;font-size:14px;padding:10px 0 2px}
.ghost{position:relative;border-radius:16px;border:1px solid rgba(255,181,158,.22);background:rgba(255,209,190,.05);padding:16px}
.badge{width:34px;height:34px;border-radius:17px;background:linear-gradient(135deg,#ffb59e,#D97757);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lab{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:#ffb59e}
.muted{font-size:12px;color:rgba(255,255,255,.55)}
.nowbox{border-radius:16px;padding:16px;background:#0e0e0e;border:1px solid rgba(126,217,149,.35)}
.nowtxt{color:#8fe0a8;font-size:14px;font-weight:700}
.nowbox .btn{margin-top:12px}
.nowdone{color:#A0A0A0;font-size:13px;text-align:center;padding:6px 0;margin-top:8px}
/* A */
.a .top{display:flex;align-items:center;gap:12px}
.a .nm{font-size:19px;line-height:23px;margin-top:2px}
.a .eff{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.a .en{font-size:24px;line-height:26px}
.a .eu{font-size:9px;letter-spacing:.4px;color:rgba(255,255,255,.55);text-transform:uppercase}
.a .btn{margin-top:16px}
/* B */
.b{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 8px 6px}
.b .art{position:absolute;top:-6px;left:50%;transform:translateX(-50%);opacity:.07}
.b .nm{position:relative;font-size:24px;margin-top:8px}
.b .en{position:relative;font-size:46px;line-height:50px;margin-top:14px}
.b .eu{position:relative;font-size:10px;letter-spacing:1.6px;font-weight:800;color:rgba(255,255,255,.55);margin-top:2px}
.b .btn{align-self:stretch;margin-top:26px}
/* B2: three equal figures */
.b .figs{position:relative;display:flex;align-self:stretch;margin-top:22px;padding:4px 0}
.b .badge{width:44px;height:44px;border-radius:22px;margin-bottom:12px}
.b .figs>div{flex:1;display:flex;flex-direction:column;align-items:center}
.b .figs>div+div{border-left:1px solid rgba(255,209,190,.10)}
.b .fn{font-size:30px;line-height:36px}
.b .fu{font-size:10px;letter-spacing:1.6px;font-weight:800;color:rgba(255,255,255,.55);margin-top:4px}
/* C */
.c .band{display:flex;border-top:1px solid rgba(255,209,190,.08);margin-top:14px;padding-top:12px}
.c .band>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.c .band>div+div{border-left:1px solid rgba(255,209,190,.08)}
.fl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.fv{font-size:16px;font-weight:700}
.fe{font-size:19px}
.c .row{display:flex;align-items:center;gap:10px}
.c .btn{margin-top:16px}
</style></head><body>
<script>
const back='<svg width="18" height="18" viewBox="0 0 24 24" fill="#ffb59e"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>';
const chk=(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>`;
const ai='<svg width="16" height="16" viewBox="0 0 24 24" fill="#2a120a"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25z"/></svg>';
const head=`<div class="head"><div class="back">${back}</div><div class="kick">SCAN</div><div class="ttl">Scan workout</div></div>`;
const cta=`<div class="btn">${ai}Enhance photo with AI</div><div class="done">Done</div>`;
const page=(x)=>`<div class="page">${head}${x}</div>`;
const NOW=page(`<div class="nowbox"><div class="nowtxt">Upper body strength saved with 42 Effort.</div><div class="btn">${ai}Enhance photo with AI</div><div class="nowdone">Done</div></div>`);
const A=page(`<div class="ghost a"><div class="top"><div class="badge">${chk(18,'#2a120a')}</div><div><div class="lab">SAVED</div><div class="nm serif">Upper body strength</div></div><div class="eff"><div class="en serif gold">42</div><div class="eu serif">Effort</div></div></div>${cta}</div>`);
const B=page(`<div class="b"><div class="art">${chk(190,'#fff')}</div><div class="lab" style="position:relative">SAVED</div><div class="nm serif">Upper body strength</div><div class="en serif gold">42</div><div class="eu">EFFORT</div>${cta}</div>`);
const B2=page(`<div class="b"><div class="badge">${chk(22,'#2a120a')}</div><div class="lab" style="position:relative">SAVED</div><div class="nm serif">Upper body strength</div><div class="figs"><div><div class="fn serif">48:00</div><div class="fu">TIME</div></div><div><div class="fn serif">6</div><div class="fu">EXERCISES</div></div><div><div class="fn serif gold">42</div><div class="fu">EFFORT</div></div></div>${cta}</div>`);
const C=page(`<div class="ghost c"><div class="row"><div class="badge">${chk(18,'#2a120a')}</div><div><div class="lab">SAVED</div><div class="serif" style="font-size:19px;margin-top:2px">Upper body strength</div></div></div><div class="band"><div><div class="fl">Time</div><div class="fv">48:00</div></div><div><div class="fl">Exercises</div><div class="fv">6</div></div><div><div class="fl">Effort</div><div class="fv fe serif gold">42</div></div></div>${cta}</div>`);
const cols=[
 ['Now','',NOW,'As it is on the phone today.'],
 ['B · Polished','',B2,'No box. The name in serif, then Time, Exercises and Effort side by side at the same size, split by fine warm lines. Effort keeps its gold. A peach check badge above replaces the faint check, which clashed with the figures.'],
];
document.write(cols.map(([t,r,c,n])=>`<div class="col"><h2>${t}${r?` <span>${r}</span>`:''}</h2>${c}<div class="note">${n}</div></div>`).join(''));
</script></body></html>

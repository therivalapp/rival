<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* No-border variant. Share card, personal best versions (same card as share-pb.html). The best
   leads in gold; the usual figures sit smaller below. */
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-wrap:wrap;gap:28px 24px;justify-content:center}
.col{width:340px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.gold{background:linear-gradient(180deg,#fff4d6,#ffc94d);-webkit-background-clip:text;color:transparent}
.card{width:340px;height:605px;border-radius:22px;overflow:hidden;position:relative;background-size:cover;background-position:center}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 44%,rgba(10,8,7,.9) 100%)}
.sky{background:linear-gradient(180deg,#2c3e5c 0%,#6f6f8c 45%,#d99a7a 78%,#f0b98f 100%)}
.sky::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 30% at 50% 82%,rgba(255,214,170,.35),rgba(255,214,170,0) 70%)}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:140px;opacity:.16}
.gedge{position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:16px;border:1.5px solid rgba(255,215,0,.55);z-index:2}
.ctop{position:absolute;top:22px;left:0;right:0;text-align:center;z-index:3;font-size:14px;font-weight:800;letter-spacing:6px;color:#ffb59e}
.cbot{position:absolute;left:22px;right:22px;bottom:24px;z-index:3}
.k{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:#ffd27a}
.k2{font-size:11.5px;color:rgba(255,230,168,.85);margin-top:5px;display:flex;align-items:center;gap:6px}
.name{font-size:29px;line-height:33px;margin-top:4px}
.hero{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap}
.hv{font-size:52px;line-height:56px}
.hu{font-size:20px}
.hs{font-size:12.5px;color:rgba(255,255,255,.72)}
.figs{display:flex;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,209,190,.22)}
.figs>div{flex:1}
.figs>div+div{padding-left:12px;border-left:1px solid rgba(255,209,190,.16);margin-left:12px}
.v{font-size:20px;line-height:24px}
.u{font-size:12px;font-family:Manrope,sans-serif;font-style:normal;color:rgba(255,255,255,.6);font-weight:600}
.l{font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.55);margin-top:3px}
.sets{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.set{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.set.on{background:rgba(255,201,77,.18);color:#ffe6a8}
</style></head><body>
<script>
const P=n=>`url(../assets/images/backgrounds/candidates/${n})`;
const tro='<svg width="12" height="12" viewBox="0 0 24 24" fill="#ffd27a"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2z"/></svg>';
const run='<svg width="230" height="230" viewBox="0 0 24 24" fill="#fff"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9 1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>';
const figs=(a)=>`<div class="figs">${a.map(([v,u,l,g])=>`<div><div class="v serif ${g?'gold':''}">${v}${u?`<span class="u"> ${u}</span>`:''}</div><div class="l">${l}</div></div>`).join('')}</div>`;
const card=(bg,inner,extra='')=>`<div class="card ${bg==='sky'?'sky':''}" style="${bg==='sky'?'':`background-image:${P(bg)}`}">${extra}<div class="ctop">RIVAL</div><div class="cbot">${inner}</div></div>`;
const cols=[
 ['Fastest time','On a run or ride over a set distance: 1K, 5K, 10K, half, marathon.',
  card('ridge-runners-hazy-backlit.png',`<div class="k">PERSONAL BEST · FASTEST 5K</div><div class="name serif">Sunset ridge run</div><div class="hero"><div class="hv serif gold">24:12</div><div class="hs">38 seconds faster</div></div>${figs([['7.1','km','DISTANCE'],['43:13','','TIME'],['68','','EFFORT',1]])}`)],
 ['Several bests at once','The biggest leads; the others are named on a second gold line.',
  card('a-single-runner-crossing-a-vast.png',`<div class="k">PERSONAL BEST · FASTEST 10K</div><div class="k2">${tro}Also fastest 5K and 1K</div><div class="name serif">Tempo Tuesday</div><div class="hero"><div class="hv serif gold">48:55</div><div class="hs">1 min 12 s faster</div></div>${figs([['10.4','km','DISTANCE'],['50:51','','TIME'],['112','','EFFORT',1]])}`)],
 ['Farthest','Distance becomes the big figure.',
  card('a-small-peloton-of-cyclists-on-a.png',`<div class="k">PERSONAL BEST · FARTHEST RIDE</div><div class="name serif">Coast road century</div><div class="hero"><div class="hv serif gold">162<span class="hu"> km</span></div><div class="hs">up from 131 km</div></div>${figs([['5:48','','TIME'],['1,840','m','CLIMB'],['301','','EFFORT',1]])}`)],
 ['Longest','Time becomes the big figure, for swims, hikes, classes.',
  card('an-open-water-swimmer-in-a-crystal.png',`<div class="k">PERSONAL BEST · LONGEST SWIM</div><div class="name serif">Bay crossing</div><div class="hero"><div class="hv serif gold">1:24:30</div><div class="hs">up from 1:02:10</div></div>${figs([['3.6','km','DISTANCE'],['2:21','/100m','PACE'],['96','','EFFORT',1]])}`)],
 ['Heaviest lift','A strength best from the lifts tracker: the weight leads, the sets sit below.',
  card('an-athlete-performing-a-heavy-deadlift-in-a.png',`<div class="k">PERSONAL BEST · DEADLIFT</div><div class="name serif">Heavy pull day</div><div class="hero"><div class="hv serif gold">160<span class="hu"> kg</span></div><div class="hs">up from 152.5 kg</div></div><div class="sets"><span class="set">5 × 140</span><span class="set">3 × 150</span><span class="set on">1 × 160</span></div>${figs([['58:00','','TIME'],['6','','EXERCISES'],['74','','EFFORT',1]])}`)],
 ['No photo','The sky for the hour it happened stands in, with the big faint figure, as on the feed.',
  card('sky',`<div class="k">PERSONAL BEST · FASTEST 1K</div><div class="name serif">Morning Run</div><div class="hero"><div class="hv serif gold">3:58</div><div class="hs">6 seconds faster</div></div>${figs([['6.2','km','DISTANCE'],['31:40','','TIME'],['52','','EFFORT',1]])}`,`<div class="art">${run}</div>`)],
];
document.write(cols.map(([t,n,c])=>`<div class="col"><h2>${t}</h2>${c}<div class="note">${n}</div></div>`).join(''));
</script></body></html>

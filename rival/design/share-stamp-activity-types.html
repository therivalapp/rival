<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px;width:1440px}.grid{display:flex;gap:16px;margin-bottom:26px}.t{width:224px}.t h3{font-size:10.5px;letter-spacing:1.8px;color:#ffb59e;margin:0 2px 8px;font-weight:800}.p{width:224px;height:398px;border-radius:16px;overflow:hidden;position:relative;background-size:cover;background-position:center}.p img{position:absolute;left:50%;transform:translateX(-50%)}.sec{font-size:12px;color:rgba(255,255,255,.6);margin:0 2px 12px}
.col{width:300px}h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.ph{width:300px;height:534px;border-radius:20px;overflow:hidden;position:relative;background:url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/ridge-runners-hazy-backlit.png) center/cover}
.ph.b2{background-image:url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/a-single-runner-crossing-a-vast.png)}
.chk{width:300px;height:250px;border-radius:14px;margin-top:12px;background-color:#ddd;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%),linear-gradient(-45deg,#bbb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#bbb 75%),linear-gradient(-45deg,transparent 75%,#bbb 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:flex;align-items:center;justify-content:center}
.ph img{position:absolute}.chk img{max-width:270px;max-height:230px}
</style></head><body>
<script>
const SERIF='Georgia, serif',SANS='Manrope, sans-serif',S=2.4;
const figs=[['7.1','km','DISTANCE'],['43:13','','TIME'],['6:05','/km','PACE']];
function mk(w,h,draw){const c=document.createElement('canvas');c.width=w*S;c.height=h*S;const x=c.getContext('2d');x.shadowColor='rgba(0,0,0,0.6)';x.shadowBlur=9*S;x.textBaseline='alphabetic';draw(x);return c.toDataURL();}
const sp=(x,t,px,py,s,center)=>{const ws=[...t].map(c=>x.measureText(c).width);const tot=ws.reduce((a,b)=>a+b,0)+s*(t.length-1);let cx=center?px-tot/2:px;x.textAlign='left';[...t].forEach((c,i)=>{x.fillText(c,cx,py);cx+=ws[i]+s;});};
const gold=(x,t,b)=>{const g=x.createLinearGradient(0,t,0,b);g.addColorStop(0,'#fff4d6');g.addColorStop(1,'#ffc94d');return g;};
const fig=(x,f,fx,y,size,center)=>{x.font=`italic 700 ${size*S}px ${SERIF}`;const vw=x.measureText(f[0]).width;x.font=`600 ${size*0.45*S}px ${SANS}`;const uw=f[1]?x.measureText(' '+f[1]).width:0;const start=center?fx-(vw+uw)/2:fx;
 x.font=`italic 700 ${size*S}px ${SERIF}`;x.fillStyle=f[3]?gold(x,y-size*S,y):'#fff';x.textAlign='left';x.fillText(f[0],start,y);if(f[1]){x.font=`600 ${size*0.45*S}px ${SANS}`;x.fillStyle='rgba(255,255,255,0.78)';x.fillText(' '+f[1],start+vw,y);}
 x.font=`800 ${8.5*S}px ${SANS}`;x.fillStyle=f[3]?'#ffd27a':'rgba(255,255,255,0.78)';sp(x,f[2],center?fx:fx,y+14*S,1.3*S,center);};
const line=(x,px,py,h)=>{const sb=x.shadowBlur;x.shadowBlur=0;x.fillStyle='rgba(255,209,190,0.4)';x.fillRect(px,py,Math.max(1,S*0.5),h);x.shadowBlur=sb;};


const rival=(x,px,y,center)=>{x.font=`800 ${13*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',px,y,5*S,center);};
const ph=n=>`url(file:///Users/rickjamesbitch/Desktop/CLAUDE%20FOLDER/rival/assets/images/backgrounds/candidates/${n})`;
const acts=[
 ['RUN','ridge-runners-hazy-backlit.png',[['7.1','km','DISTANCE'],['43:13','','TIME'],['6:05','/km','PACE'],['68','','EFFORT',1]]],
 ['RIDE','a-small-peloton-of-cyclists-on-a.png',[['162','km','DISTANCE'],['5:48:10','','TIME'],['27.9','km/h','SPEED'],['301','','EFFORT',1]]],
 ['SWIM','an-open-water-swimmer-in-a-crystal.png',[['3.6','km','DISTANCE'],['1:24:30','','TIME'],['2:21','/100m','PACE'],['96','','EFFORT',1]]],
 ['STRENGTH','an-athlete-performing-a-heavy-deadlift-in-a.png',[['160','kg','DEADLIFT'],['6','','EXERCISES'],['58:00','','TIME'],['74','','EFFORT',1]]],
 ['HIKE','2-3-hikers-walking-along-a-rugged.png',[['14.2','km','DISTANCE'],['4:12:00','','TIME'],['1,120','m','CLIMB'],['188','','EFFORT',1]]],
 ['YOGA','a-diverse-group-of-people-practicing-yoga-on.png',[['1:00:00','','TIME'],['35','','EFFORT',1]]],
];
const rowStamp=(f4)=>{const n=f4.length;const W=Math.max(200,n*86+20);return mk(W,100,x=>{const C=W/2*S,cw=86*S;let y=24*S;rival(x,C,y,true);y+=40*S;f4.forEach((f,i)=>{const fx=C+(i-(n-1)/2)*cw;if(i)line(x,fx-cw/2,y-19*S,19*1.55*S);fig(x,f,fx,y,19,true);});});};
const colStamp=(f4)=>mk(170,70+f4.length*68,x=>{const C=85*S;let y=24*S;x.font=`800 ${14*S}px ${SANS}`;x.fillStyle='#ffb59e';sp(x,'RIVAL',C,y,5.5*S,true);y+=36*S;
 f4.forEach(([v,u,l,g])=>{x.font=`800 ${9*S}px ${SANS}`;x.fillStyle=g?'#ffd27a':'rgba(255,255,255,0.8)';sp(x,l,C,y,1.6*S,true);y+=30*S;
  x.font=`italic 700 ${28*S}px ${SERIF}`;const vw=x.measureText(v).width;let cx=C-vw/2;x.fillStyle=g?gold(x,y-26*S,y):'#fff';x.textAlign='left';x.fillText(v,cx,y);
  if(u){x.font=`600 ${12.5*S}px ${SANS}`;x.fillStyle='rgba(255,255,255,0.78)';x.fillText(' '+u,cx+vw,y);}y+=38*S;});});
const tiles=(kind)=>acts.map(([t,p,f])=>{const src=kind==='row'?rowStamp(f):colStamp(f);const w=kind==='row'?Math.min(216,(Math.max(200,f.length*86+20))*0.62):110;
 return `<div class="t"><h3>${t}</h3><div class="p" style="background-image:${ph(p)}"><img src="${src}" style="width:${w}px;bottom:${kind==='row'?14:16}px"></div></div>`;}).join('');
document.write(`<div class="sec">A2 · centred row</div><div class="grid">${tiles('row')}</div><div class="sec">G · stacked column</div><div class="grid">${tiles('col')}</div>`);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121010;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:26px;align-items:center}
.col{width:340px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.stage{position:relative;border-radius:22px;padding:18px 10px 22px;background:radial-gradient(ellipse 90% 70% at 50% 35%,#3a2a22,#1c1816 75%);overflow:hidden}
.k{text-align:center;font-size:11px;letter-spacing:2.4px;font-weight:800;color:#ffd3c2}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:12px;height:230px;position:relative;margin-top:6px}
.c{width:82px;display:flex;flex-direction:column;align-items:center}
.seat{border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative;overflow:hidden}
.p{width:100%;position:relative;border:1.25px solid;border-radius:2px}
.p b{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:22px;opacity:.75}
.disc{position:absolute;left:-6px;right:-6px;bottom:-26px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.03)}
.t{text-align:center;font-size:26px;white-space:nowrap;margin-top:44px}
.s{text-align:center;font-size:11px;letter-spacing:2.2px;font-weight:800;color:#ffd3c2;margin-top:6px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:16px}.btns .btn{margin:0;width:140px}.btn.fill{background:linear-gradient(90deg,#d9805f,#f2b39c);color:#4a1a0c;border:0}
.btn{margin:16px auto 0;width:170px;height:46px;border-radius:23px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#ffd3c2}
.wr{position:absolute;inset:-9px;border-radius:50%;border:2px dotted rgba(236,198,84,.75)}
.me{background:#e8835f;color:#4a1a0c;font-weight:800}
.ini{font-weight:800;font-size:20px}
.face{background-size:cover;background-position:center}
.plus{font-size:22px;font-weight:600}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
</style></head><body>
<script>
const G={tint:'#FFD700',bg:'linear-gradient(180deg,rgba(255,215,0,.22),rgba(180,140,10,.06))'};
const S={tint:'#c8a890',bg:'linear-gradient(180deg,rgba(150,130,110,.25),rgba(60,50,45,.06))'};
const B={tint:'#7fc4b0',bg:'linear-gradient(180deg,rgba(110,170,150,.22),rgba(40,60,55,.06))'};
function col(st,h,size,seat,n,lead){return `<div class="c"><div class="seat" style="width:${size}px;height:${size}px;${seat.style||''}">${lead?'<div class="wr"></div>':''}${seat.html||''}</div><div class="p" style="height:${h}px;border-color:${st.tint}55;background:${st.bg}"><b class="serif">${n}</b></div></div>`}
const card=(seats,btns='<div class="btn">Find a team</div>')=>`<div class="stage"><div class="k">— WEEKLY LEADER —</div><div class="pod"><div class="disc"></div>${col(S,92,44,seats[0],2)}${col(G,126,55,seats[1],1,true)}${col(B,74,44,seats[2],3)}</div><div class="t serif">Train better together</div><div class="s">JOIN OR CREATE A TEAM</div>${btns}</div>`;
const dash=(t,o)=>({style:`border:1.5px dashed ${t};opacity:${o};background:rgba(255,255,255,.03)`});
const meSeat={style:'border:1.5px solid rgba(255,215,0,.6)',html:'<div class="seat me ini" style="width:100%;height:100%;margin:0;font-size:24px">R</div>'};
const plus=(t)=>({style:`border:1.5px dashed ${t}99;background:rgba(255,255,255,.04);color:${t}`,html:'<span class="plus">+</span>'});
const letter=(l,t)=>({style:`border:1.5px solid ${t}66;background:${t}22;color:#fff`,html:`<span class="ini" style="opacity:.8">${l}</span>`});
document.write(`
<div class="col"><h2>A1 · One button</h2>${card([plus('#c8a890'),meSeat,plus('#7fc4b0')])}<div class="note">Find a team leads to the team list, which already has Create a team on it.</div></div>
<div class="col"><h2>A2 · Two buttons <span>recommended</span></h2>${card([plus('#c8a890'),meSeat,plus('#7fc4b0')],'<div class="btns"><div class="btn">Join a team</div><div class="btn">Create a team</div></div>')}<div class="note">The buttons match the line above them: one for each way in.</div></div>
`);
</script></body></html>

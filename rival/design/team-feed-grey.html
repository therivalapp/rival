<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0d0d0d;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:30px;align-items:center}
.col{width:361px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.page{padding:14px 12px;border-radius:18px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.post{position:relative;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.post>*{position:relative}
.hd{display:flex;align-items:center;gap:9px}
.av{width:36px;height:36px;border-radius:18px;background-size:cover;background-position:center;border:1px solid rgba(255,181,158,.4)}
.nm{font-size:15px}.mt{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}.mt b{color:#ffb59e;font-weight:600}
.ph{border-radius:14px;aspect-ratio:4/5;background-size:cover;background-position:center;max-height:260px;width:100%}
.tr{display:flex;justify-content:space-between;align-items:flex-end;padding:0 2px;margin-top:-4px}
.tt{font-size:16px;line-height:20px}.su{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin-top:3px}
.ef{text-align:right}.ef b{font-size:22px;line-height:24px;color:#ffb59e;display:block}.ef i{font-style:italic;font-family:Georgia,serif;font-weight:700;font-size:9px;letter-spacing:.4px;color:rgba(255,255,255,.55);text-transform:uppercase}
.rx{display:flex;gap:16px;font-size:13px;font-weight:700;color:rgba(255,255,255,.6);padding:2px 2px 0}
.bar{position:absolute;top:6px;bottom:6px;width:3px}
.edge{position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(180deg,rgba(255,209,190,.30),rgba(255,209,190,.08) 45%,rgba(255,209,190,0));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tl{font-size:16px;line-height:20px;color:rgba(255,255,255,.92)}
.fc{border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#323232;overflow:hidden}
.fcr{display:flex;padding:10px 0}.fcc{flex:1;text-align:center;display:flex;flex-direction:column;gap:3px}.fcc+.fcc{border-left:1px solid rgba(255,255,255,.08)}
.fcl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5)}.fcv{font-size:16px;font-weight:700}
.gold{font-family:Georgia,serif;font-style:italic;font-size:19px;background:linear-gradient(180deg,#fff4d6,#ffc94d);-webkit-background-clip:text;color:transparent}
.band{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:12.5px;font-weight:700;color:#ffb59e}.band span{font-weight:500;color:rgba(255,255,255,.5)}
.rr{display:flex;align-items:center;gap:16px;padding:0 2px;font-size:12.5px;font-weight:700;color:#e5e2e1}.rr i{font-style:normal;font-size:11.5px;font-weight:800;margin-left:5px}.rr .c{margin-left:auto}
.jc{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:5px}
.jl{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#ffb59e}.jt{font-size:13.5px;line-height:19px;font-weight:700}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
</style></head><body>
<script>
const PH='https://dgauxvrvqnkbfvarexok.supabase.co/storage/v1/object/public/activity-photos/09b2e197-8257-4d7c-a0e6-12dc0429eeff/56815b0f-f1f6-4162-942b-69ec5919a96c-1791995048169-9r3enf.jpg';
const body=`<div class="hd"><div class="av" style="background-image:url('${PH}')"></div><div><div class="nm serif">Ricky J.</div><div class="mt">1h · <b>The Hidden Leaf</b></div></div></div>
<div class="tl serif">Blue city</div>
<div class="ph" style="background-image:url('${PH}');max-height:none"></div>
<div class="fc"><div class="band"><svg width="13" height="13" viewBox="0 0 24 24" fill="#ffb59e"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg>2 week streak<span> · 3 this week</span></div><div class="fcr"><div class="fcc"><div class="fcl">Time</div><div class="fcv">43:13</div></div><div class="fcc"><div class="fcl">Distance</div><div class="fcv">7.1 km</div></div><div class="fcc"><div class="fcl">Climb</div><div class="fcv">127 m</div></div><div class="fcc"><div class="fcl">Effort</div><div class="fcv gold">76</div></div></div></div>
<div class="rr"><span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5e2e1" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Respect<i>3</i></span><span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5e2e1" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Inspired<i>1</i></span><span class="c"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5e2e1" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>2</span></div>
<div class="jc"><div class="jl">Journal</div><div class="jt">Easy pace along the water. Legs felt fresh.</div></div>`;
const bars=c=>`<div class="bar" style="left:-1px;background:linear-gradient(180deg,transparent,${c} 25%,${c} 75%,transparent)"></div><div class="bar" style="right:-1px;background:linear-gradient(180deg,transparent,${c} 25%,${c} 75%,transparent)"></div>`;
const brown='border:1px solid rgba(255,181,158,.14);background:radial-gradient(circle at -10% -15%,rgba(255,209,190,.14),rgba(255,209,190,0) 70%),linear-gradient(135deg,#231e1b,#2d241f 55%,#3b2821)';
const lit='background:radial-gradient(ellipse 70% 30% at 50% 0%,rgba(217,119,87,.17),rgba(217,119,87,.035) 60%,rgba(217,119,87,0) 85%) no-repeat,#282828';
const opts=[
 ['Now','', '#131313', `<div class="post" style="${brown}">${body}${bars('#D97757')}</div>`,'Brown gradient with salmon bars down both sides.'],
 ['A · Today grey, lit edge','recommended','#131313',`<div class="post" style="${lit}"><div class="edge"></div>${body}</div>`,'The Add activity grey with the soft top glow and lit edge from Today. No side bars on everyday posts; a personal best or event would keep its gold or ivory bars.'],
 ['B · Today grey, salmon bars','','#131313',`<div class="post" style="${lit}"><div class="edge"></div>${body}${bars('#D97757')}</div>`,'Same grey and glow, keeping the salmon bars.'],
 ['C · Activity page, flat','','#282828',`<div class="post" style="background:rgba(255,255,255,.055)">${body}</div>`,'Like the journal card on an activity: a grey page with flat, lighter cards. No glow, no edge.'],
];
document.write(opts.map(([t,r,pg,card,n])=>`<div class="col"><h2>${t}${r?` <span>${r}</span>`:''}</h2><div class="page" style="background:${pg}">${card}</div><div class="note">${n}</div></div>`).join(''));
</script></body></html>

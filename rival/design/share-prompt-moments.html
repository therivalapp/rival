<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* 1: ActivityDiaryViewer phone — photoArea + photoMelt + photoTitle, statCard
   + statCardPop + statCardLit, diary. Only the Share row is new.
   2: the share card it makes (9:16 story).
   3: a proud-moment prompt in the pop-up standard (GreySheet). */
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.col{width:375px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.gold{background:linear-gradient(180deg,#fff4d6,#ffc94d);-webkit-background-clip:text;color:transparent}
.phone{width:375px;height:780px;border-radius:28px;overflow:hidden;background:#282828;position:relative}
.photo{height:437px;position:relative;background:url(../assets/images/backgrounds/candidates/ridge-runners-hazy-backlit.png) center/cover}
.melt{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(0deg,#282828 0%,rgba(40,40,40,.8) 40%,rgba(40,40,40,0))}
.ptitle{position:absolute;left:20px;right:20px;bottom:2px}
.kick{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:#ffb59e}
.pname{font-size:26px;margin-top:2px}
.body{padding:10px 16px 0}
.stat{display:flex;padding:13px 0;border-radius:16px;border:1px solid;border-color:rgba(255,209,190,.26) rgba(255,209,190,.09) rgba(255,209,190,.03);
  background:#323232 radial-gradient(ellipse 70% 55% at 50% 0%,rgba(217,119,87,.17),rgba(217,119,87,.035) 60%,rgba(217,119,87,0) 85%) no-repeat border-box}
.stat>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.stat>div+div{border-left:1px solid rgba(255,255,255,.08)}
.sl{font-size:10px;font-weight:800;letter-spacing:1.3px;color:rgba(255,255,255,.5)}
.sv{font-size:19px;font-weight:700}
.se{font-size:22px}
.share{margin-top:10px;display:flex;gap:8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border-radius:999px;font-weight:800;font-size:14.5px}
.pri{color:#2a120a;background:linear-gradient(135deg,#ffb59e,#D97757)}
.gh{color:#ffb59e;border:1px solid rgba(255,209,190,.28)}
.diary{margin-top:10px;padding:14px 16px 16px;border-radius:16px;background:rgba(255,255,255,.055)}
.dh{display:flex;justify-content:space-between;align-items:baseline}
.dl{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.6)}
.dd{font-size:12px;color:rgba(255,255,255,.5)}
.dp{font-size:18px;font-weight:700;margin-top:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
.line{height:33px;border-bottom:1px solid rgba(255,255,255,.1)}
/* share card */
.card{width:375px;height:667px;border-radius:22px;overflow:hidden;position:relative;background:url(../assets/images/backgrounds/candidates/ridge-runners-hazy-backlit.png) center/cover}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 48%,rgba(10,8,7,.88) 100%)}
.ctop{position:absolute;top:22px;left:0;right:0;text-align:center;z-index:1;font-size:15px;font-weight:800;letter-spacing:6px;color:#ffb59e}
.cbot{position:absolute;left:22px;right:22px;bottom:24px;z-index:1}
.cname{font-size:32px;line-height:36px;margin-top:4px}
.cdate{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:4px}
.cfigs{display:flex;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,209,190,.22)}
.cfigs>div{flex:1}
.cfigs>div+div{padding-left:14px;border-left:1px solid rgba(255,209,190,.16);margin-left:14px}
.cv{font-size:26px;line-height:30px}
.cu{font-size:13px;font-family:Manrope,sans-serif;font-style:normal;color:rgba(255,255,255,.6);font-weight:600}
.cl{font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.55);margin-top:3px}
/* prompt */
.dim{width:375px;height:667px;border-radius:22px;overflow:hidden;position:relative;background:#131313}
.dim::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#232120;border-radius:24px 24px 0 0;padding:10px 20px 30px;text-align:center}
.sheet::before{content:'';position:absolute;left:0;right:0;top:0;height:160px;border-radius:24px 24px 0 0;background:radial-gradient(ellipse 80% 100% at 50% 0%,rgba(255,201,77,.14),rgba(255,201,77,0) 70%)}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 18px}
.pk{position:relative;font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:#ffd27a}
.pt{position:relative;font-size:24px;margin-top:6px}
.pv{position:relative;font-size:46px;line-height:52px;margin-top:10px}
.ps{position:relative;font-size:12.5px;color:rgba(255,255,255,.55);margin-top:2px}
.pq{position:relative;font-family:Georgia,serif;font-style:italic;font-size:15px;color:rgba(255,255,255,.85);margin:22px 0 18px}
.sheet .pill{position:relative}
.later{position:relative;color:rgba(255,255,255,.6);font-weight:700;font-size:14px;margin-top:14px}

/* PB versions */
.pbedge{position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:26px;border:1.5px solid rgba(255,215,0,.6);z-index:5;pointer-events:none}
.statpb{flex-direction:column;padding:0;border-color:rgba(255,201,77,.4);background:#323232 radial-gradient(ellipse 80% 120% at 50% 0%,rgba(217,119,87,.22),rgba(217,119,87,.08) 45%,rgba(217,119,87,0)) ;overflow:hidden}
.statpb>div+div{border-left:0}
.stat.statpb>.band{flex:none;flex-direction:row;align-items:center;gap:8px}
.stat.statpb>.srow{flex:none;flex-direction:row;align-items:stretch;gap:0}
.band{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid rgba(255,201,77,.18);background:linear-gradient(90deg,rgba(255,201,77,.13),rgba(255,201,77,0));font-size:12.5px}
.bt{font-weight:700;color:#ffe6a8}.bf{color:rgba(255,255,255,.5)}
.srow{display:flex;padding:13px 0}.srow>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}.srow>div+div{border-left:1px solid rgba(255,255,255,.08)}
.lb{color:#ffd27a}
.gedge{position:absolute;top:10px;left:10px;right:10px;bottom:10px;border-radius:16px;border:1.5px solid rgba(255,215,0,.55);z-index:2}
.pbk{color:#ffd27a}
.hero{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.hv{font-size:54px;line-height:58px}
.hs{font-size:12.5px;color:rgba(255,255,255,.7)}
.cfigs.small .cv{font-size:20px;line-height:24px}
</style></head><body>
<script>
const sh='<svg width="16" height="16" viewBox="0 0 24 24" fill="#2a120a"><path d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6a2 2 0 0 1-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3a2 2 0 0 1 2 2z"/></svg>';
const sheet=(k,t,v,sub,glow='255,201,77',kc='#ffd27a',extra='')=>`<div class="dim" style="background:#131313"><div class="sheet"><style></style><div class="grab"></div>${extra}<div class="pk" style="color:${kc}">${k}</div><div class="pt serif">${t}</div><div class="pv serif ${glow==='255,201,77'?'gold':''}" ${glow!=='255,201,77'?`style="color:rgb(${glow})"`:''}>${v}</div><div class="ps">${sub}</div>
<div class="pq">Share your effort. You could be inspiring someone.</div><div class="pill pri">${sh}Share</div><div class="later">Not now</div></div></div>`;
const rankBadge='<div style="position:relative;width:64px;height:64px;margin:0 auto 12px;border-radius:32px;background:radial-gradient(circle at 35% 30%,#e9f1ff,#9fb4d8 60%,#5c6f93);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset"></div>';
const medal='<div style="position:relative;width:64px;height:64px;margin:0 auto 12px;border-radius:32px;background:linear-gradient(135deg,#ffb59e,#D97757);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="#2a120a"><path d="M12 7.13l.97 2.29.47 1.11 1.2.1 2.47.21-1.88 1.63-.91.79.27 1.18.56 2.41-2.12-1.28-1.03-.64-1.03.62-2.12 1.28.56-2.41.27-1.18-.91-.79-1.88-1.63 2.47-.21 1.2-.1.47-1.11.97-2.27M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg></div>';
const cols=[
 ['Personal best · fastest',sheet('NEW PERSONAL BEST','5K','24:12','38 seconds faster than your last best'),'The first time a new fastest time shows. Share opens the gold-bordered card.'],
 ['Personal best · lift',sheet('NEW PERSONAL BEST','Deadlift','160 kg','Up from 152.5 kg'),'A heavier lift logged on a workout. Needs lift bests on the activity first (see the note).'],
 ['Rank reached',sheet('NEW RANK','You reached','ELITE','12,650 Effort this year','159,180,216','#b9c9ea',rankBadge),'When a rank is reached; the rank in its own material colour, as on Ranks.'],
 ['Achievement',sheet('ACHIEVEMENT','Thousand K','1,000 km','Covered since 1 January','255,181,158','#ffb59e',medal),'An achievement unlocking; the big figure is what it took.'],
];
document.write(cols.map(([t,c,n])=>`<div class="col"><h2>${t}</h2>${c}<div class="note">${n}</div></div>`).join(''));
</script></body></html>

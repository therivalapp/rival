<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:30px;align-items:center}
.col{width:380px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.page{background:#131313;background-image:radial-gradient(ellipse 90% 65% at 50% 55%,rgba(217,119,87,.11),rgba(19,19,19,0) 75%);padding:18px 16px 22px;border-radius:18px;display:flex;flex-direction:column}
.btn{height:52px;border-radius:26px;margin:0 30px;background:linear-gradient(90deg,#d9805f,#f2b39c);color:#4a1a0c;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.card{position:relative;border-radius:16px;background:#282828 radial-gradient(ellipse 70% 55% at 50% 0%,rgba(217,119,87,.17),rgba(217,119,87,.035) 60%,rgba(217,119,87,0) 85%) no-repeat border-box;border:1px solid transparent;margin:0 -8px}
.edge{position:absolute;inset:-1px;border-radius:16px;padding:1px;pointer-events:none;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.e05{background:linear-gradient(180deg,rgba(255,209,190,.30),rgba(255,209,190,.09) 45%,rgba(255,209,190,.05))}
.e0{background:linear-gradient(180deg,rgba(255,209,190,.30),rgba(255,209,190,.08) 45%,rgba(255,209,190,0))}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
/* Now: cells with dividers and icons */
.row{display:flex;padding:8px 0}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 4px}
.cell+.cell{border-left:1px solid rgba(255,209,190,.08)}
.ic{height:20px;display:flex;align-items:center;justify-content:center}
.v{line-height:36px;font-size:28px}
.vs{font-size:22px;line-height:36px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:6px;line-height:13px;white-space:nowrap}
.det{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.55);margin-top:1px;line-height:13px}
/* Tiles */
.tiles{display:flex;gap:8px;padding:12px}
.tile{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:10px 4px 9px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,209,190,.08)}
.tv{font-size:29px;line-height:31px;height:31px;white-space:nowrap}
.tv em{font-family:Manrope;font-style:normal;font-size:13px;font-weight:600;color:rgba(255,255,255,.5)}
.tl{margin-top:2px;font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}
.tlg{color:rgba(255,255,255,.5)}
.tlw{color:#fff}
.tg{margin-top:2px;font-size:11px;font-weight:600}
.sal{color:#ffb59e}.gry{color:rgba(255,255,255,.55)}
.gold{background:linear-gradient(180deg,#ffe6b0,#f5b759);-webkit-background-clip:text;color:transparent}
.elite{background:linear-gradient(180deg,#e3d4ff,#a98be0);-webkit-background-clip:text;color:transparent;text-transform:uppercase;letter-spacing:1.2px}
.salv{color:#e8835f}
.ms{border-top:1px solid rgba(255,209,190,.08);padding:12px 18px 13px;display:flex;flex-direction:column;gap:10px}
.msh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#9fd9bd}
.msh b{font-size:12px;letter-spacing:0;text-transform:none;font-weight:700}
.mst{font-size:17px;line-height:22px;color:#cdeedd}
.trk{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.trk i{display:block;height:6px;width:88%;background:linear-gradient(90deg,#4f8a6b,#a6e0c3)}
.gap14{height:14px}.gap30{height:30px}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
</style></head><body>
<script>
const run='<svg width="16" height="16" viewBox="0 0 24 24" fill="#D97757"><circle cx="14" cy="4" r="2"/><path d="M13 7l-4 2-2 4 2 1 1.6-3 1.4.6-2 5-4 2 1 2 5-2.5 1.5-3 2 2.4V21h2v-6l-2.5-3 1-3 1.5 2H20v-2h-3l-2-2.6z"/></svg>';
const gem='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9b3ff" stroke-width="1.8"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21L8 9l4-6 4 6z"/></svg>';
const fire='<svg width="16" height="16" viewBox="0 0 24 24" fill="#D97757"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg>';
const nowRow=`<div class="card"><div class="edge e05"></div><div class="row">
<div class="cell"><div class="ic">${run}</div><div class="v vs serif">Run</div><div class="lbl">Last · Yesterday</div><div class="det">+76 Effort</div></div>
<div class="cell"><div class="ic">${gem}</div><div class="v vs serif elite">Elite</div><div class="lbl">2026 Rank</div><div class="det">72 days left</div></div>
<div class="cell"><div class="ic">${fire}</div><div class="v serif salv">1</div><div class="lbl">Week streak</div><div class="det">1 of 3 this week</div></div></div></div>`;
const statsCard=(lc,gc,edge)=>`<div class="card"><div class="edge ${edge}"></div><div class="tiles">
<div class="tile"><div class="tv serif">239</div><div class="tl ${lc}">Activities</div><div class="tg ${gc}">+1 this week</div></div>
<div class="tile"><div class="tv serif" style="font-size:23px">1,507<em> km</em></div><div class="tl ${lc}">Distance</div><div class="tg ${gc}">+7 km</div></div>
<div class="tile"><div class="tv serif" style="font-size:20px">18,881<em> m</em></div><div class="tl ${lc}">Elevation</div><div class="tg ${gc}">+127 m</div></div></div>
<div class="ms"><div class="msh">Next milestone<b>351 Effort to go</b></div><div class="mst serif">Champion rank</div><div class="trk"><i></i></div></div></div>`;
const tileRow=(lc,gc)=>`<div class="card"><div class="edge e0"></div><div class="tiles">
<div class="tile"><div class="tv serif">Run</div><div class="tl ${lc}">Yesterday</div><div class="tg ${gc}">+76 Effort</div></div>
<div class="tile"><div class="tv serif elite" style="font-size:22px">Elite</div><div class="tl ${lc}">2026 rank</div><div class="tg ${gc}">72 days left</div></div>
<div class="tile"><div class="tv serif salv">1</div><div class="tl ${lc}">Week streak</div><div class="tg ${gc}">1 of 3 this week</div></div></div></div>`;
const page=(row,stats)=>`<div class="page"><div class="btn">Add activity</div><div class="gap14"></div>${row}<div class="gap30"></div>${stats}</div>`;
document.write(`
<div class="col"><h2>Now</h2>${page(nowRow,statsCard('tlg','sal','e05'))}<div class="note">Top card: icons, dividers, its own type. Bottom card: tiles. The edge never fully fades, so a faint line runs along each bottom.</div></div>
<div class="col"><h2>A · Both cards as tiles, one style <span>recommended</span></h2>${page(tileRow('tlw','gry'),statsCard('tlw','gry','e0'))}<div class="note">The Today row becomes three tiles like the stats card. No icons. Both cards use your latest label style: white labels, grey detail lines. "Last · Yesterday" shortens to "Yesterday" so it fits its tile. Edges fade fully away at the bottom.</div></div>
<div class="col"><h2>B · Tiles, each card keeps its colours</h2>${page(tileRow('tlw','gry'),statsCard('tlg','sal','e0'))}<div class="note">Same tile shape on both, but the stats card keeps grey labels and salmon "this week" lines.</div></div>
`);
</script></body></html>

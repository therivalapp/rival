<style>
body{margin:0;background:#121010;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;box-sizing:border-box;display:flex;gap:22px;flex-direction:column;align-items:center}

.pages{display:flex;justify-content:center;margin-top:14px;color:rgba(255,255,255,.4);font-size:12px;font-weight:600;gap:6px;align-items:center}
</style><style>

.chev{color:rgba(255,255,255,.45);font-size:15px}

.sky1{background:linear-gradient(180deg,#2c3846,#4d5f72)}.sky2{background:linear-gradient(180deg,#3a2c46,#6a4f62)}

<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feed Card Stats</title>
<style>
:root{color-scheme:dark;--bg:#0e0c0b;--accent:#ffb59e;--muted:rgba(255,255,255,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:24px 16px 60px}
h1{font:italic 700 26px Georgia,serif;text-align:center;margin:0 0 4px}
.lead{color:var(--muted);text-align:center;margin:0 auto 24px;max-width:600px}
.row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.opt{width:350px;display:flex;flex-direction:column;gap:10px}
.t{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:center}
.d{color:var(--muted);font-size:12.5px;text-align:center;min-height:54px}
.card{background:linear-gradient(180deg,#30261f,#211a16);border:1px solid rgba(255,181,158,.16);border-left:3px solid #c97a5c;border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--a)}
.nm{font:italic 700 17px Georgia,serif}.sub{font-size:12px;color:var(--muted)}.sub b{color:var(--accent);font-weight:600}
.title{font:italic 700 20px Georgia,serif}
.ph{height:150px;border-radius:14px;background:var(--p);position:relative;overflow:hidden}
.stats{background:#36302b;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
.stats.pb{border-color:rgba(255,201,77,.42)}
.stats.glass{background:rgba(30,25,22,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:rgba(255,255,255,.14)}
.band{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.07)}
.band svg{width:13px;height:13px;flex:none}
.band.gold{background:linear-gradient(90deg,rgba(255,201,77,.13),rgba(255,201,77,0));border-bottom-color:rgba(255,201,77,.18)}
.band b{font-weight:700}.band span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 2px;text-align:center}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid div+div{border-left:1px solid rgba(255,255,255,.08)}
.grid span{display:block;font-size:8.5px;letter-spacing:1.2px;color:var(--muted);font-weight:800}
.grid b{display:block;font-size:16px;margin-top:3px}
.gold{background:linear-gradient(#fff4d6,#ffc94d);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid .e b{font:italic 700 19px Georgia,serif}
.grid .best span{color:#ffd27a}
.float{position:absolute;left:8px;right:8px;bottom:8px}
.re{display:flex;align-items:center;gap:20px;font-weight:700;font-size:13.5px;padding:0 2px}
.re span{display:flex;align-items:center;gap:6px}.re em{font-style:normal;font-weight:500;opacity:.6}
.re .c{margin-left:auto;color:var(--muted);font-weight:600}
.re svg{width:15px;height:15px}
.strip{display:flex;align-items:stretch;background:#36302b;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
.strip .l{flex:1;display:grid;grid-template-columns:repeat(3,1fr);padding:10px 2px;text-align:center}
.strip .l div+div{border-left:1px solid rgba(255,255,255,.08)}
.strip .l span{display:block;font-size:8.5px;letter-spacing:1.2px;color:var(--muted);font-weight:800}
.strip .l b{display:block;font-size:15px;margin-top:3px}
.strip .r{width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid rgba(255,201,77,.2);background:linear-gradient(180deg,rgba(255,201,77,.1),rgba(255,201,77,0))}
.strip .r b{font:italic 700 26px Georgia,serif;line-height:1}.strip .r span{font-size:8.5px;letter-spacing:1.4px;color:#ffd27a;font-weight:800;margin-top:3px}
.sep{height:14px}
.rec{color:#ffc94d}
</style></head><body>
<h1>Feed cards with the activity page's numbers</h1>
<p class="lead">Each option shows two cards: a run with a streak line, and a ride that set a personal best. The streak and personal-best lines move into the numbers card, so nothing floats between the photo and the reactions.</p>
<div class="row" id="r"></div>
<script>
const I={
 fire:'<svg viewBox="0 0 24 24"><path d="M12 2c1 3-1 5-2 7-1.5 3 0 6 2 6s3.5-2 2.5-5c2 1.5 3.5 4 3.5 6.5A6 6 0 016 16.5C6 11 11 8 12 2z" fill="#D97757"/></svg>',
 tro:'<svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 01-10 0zM5 5H3v2a4 4 0 004 4M19 5h2v2a4 4 0 01-4 4M10 14h4v3h-4zM8 20h8" fill="none" stroke="#ffd27a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.8" stroke-linejoin="round"/></svg>',
 bolt:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="rgba(255,255,255,.85)"/></svg>',
 bub:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.8" stroke-linejoin="round"/></svg>',
};
const P=[
 {nm:'Sandy',a:'linear-gradient(135deg,#d7c9b8,#6c5a4a)',ago:'8h ago',title:'Morning Run',p:'linear-gradient(160deg,#3d5a6c,#c98b5b)',time:'21:15',dist:'4.0 km',climb:'126 m',eff:'44.6',band:['fire','<b>4th run this month</b>',false],pb:false},
 {nm:'Ricky Jackson-Lewis',a:'linear-gradient(135deg,#7a9bb5,#3d5a6c)',ago:'2d ago',title:'Morning Ride',p:'linear-gradient(170deg,#2f4a63,#8fb3c9)',time:'2:03:20',dist:'42.1 km',climb:'709 m',eff:'179.8',band:['tro','<b style="color:#ffe6a8">Farthest ride</b><span> · up from 40.0 km</span>',true],pb:true},
];
const head=c=>`<div class="hd"><div class="av" style="--a:${c.a}"></div><div><div class="nm">${c.nm}</div><div class="sub">${c.ago} · <b>The Hidden Leaf</b></div></div></div>`;
const re=`<div class="re"><span>${I.star}Respect<em>2</em></span><span>${I.bolt}Inspired<em>0</em></span><span class="c">${I.bub}0</span></div>`;
const band=c=>`<div class="band ${c.band[2]?'gold':''}">${I[c.band[0]]}${c.band[1]}</div>`;
const grid=(c,cls='')=>`<div class="grid"><div><span>TIME</span><b>${c.time}</b></div><div class="${c.pb?'best':''}"><span>${c.pb?'BEST':'DISTANCE'}</span><b class="${c.pb?'gold':''}">${c.dist}</b></div><div><span>CLIMB</span><b>${c.climb}</b></div><div class="e"><span>EFFORT</span><b class="gold">${c.eff}</b></div></div>`;
const A=c=>`<div class="card">${head(c)}<div class="title">${c.title}</div><div class="ph" style="--p:${c.p}"></div><div class="stats ${c.pb?'pb':''}">${band(c)}${grid(c)}</div>${re}</div>`;
const B=c=>`<div class="card">${head(c)}<div class="title">${c.title}</div><div class="ph" style="--p:${c.p};height:190px"><div class="float stats glass ${c.pb?'pb':''}">${band(c)}${grid(c)}</div></div>${re}</div>`;
const C=c=>`<div class="card">${head(c)}<div class="title">${c.title}</div><div class="ph" style="--p:${c.p}"></div>${band(c).replace('class="band','style="border:1px solid rgba(255,255,255,.07);border-radius:10px" class="band')}<div class="strip" ${c.pb?'style="border-color:rgba(255,201,77,.42)"':''}><div class="l"><div><span>TIME</span><b>${c.time}</b></div><div class="${c.pb?'best':''}"><span style="${c.pb?'color:#ffd27a':''}">${c.pb?'BEST':'DISTANCE'}</span><b class="${c.pb?'gold':''}">${c.dist}</b></div><div><span>CLIMB</span><b>${c.climb}</b></div></div><div class="r"><b class="gold">${c.eff}</b><span>EFFORT</span></div></div>${re}</div>`;
const O=[
 ['A · Same card as the activity page','Title, photo, then the numbers card with its band on top. The Effort figure moves from the top corner into the card.',A,1],
 ['B · Numbers over the photo','The numbers card sits on the bottom of the photo in frosted glass. Compact, but covers part of the photo.',B,0],
 ['C · Effort as the hero','Three numbers on the left, Effort large in its own gold panel on the right. The streak line stays as its own row.',C,0],
];
document.getElementById('r').innerHTML=O.map(([t,d,f,rec])=>`<div class="opt"><div class="t ${rec?'rec':''}">${t}${rec?' · recommended':''}</div><div class="d">${d}</div>${f(P[0])}<div class="sep"></div>${f(P[1])}</div>`).join('');
</script>
</body></html>

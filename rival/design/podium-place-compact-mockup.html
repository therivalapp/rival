<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1710px;background:#151413;font-family:Manrope,sans-serif;color:#fff;padding:28px 0 30px}
.row{display:flex;gap:36px;padding:0 30px}.col{width:375px}
.tag{font-size:12px;font-weight:800;letter-spacing:1.4px;color:#ffb59e;text-transform:uppercase}
.desc{font-size:13px;line-height:1.45;color:#bdbdbd;margin:8px 0 16px;min-height:76px}
.ph{position:relative;width:375px;height:812px;border-radius:30px;overflow:hidden;background:#131313}
.ph img{display:block;width:375px}
.nav{position:absolute;left:0;bottom:0}
.cap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 14px;background:linear-gradient(#1a1615,#131313 40%)}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700;line-height:1}
.grad{background:linear-gradient(100deg,#D97757 0%,#ffb59e 45%,#F5B759 100%);-webkit-background-clip:text;color:transparent}
.sal{color:#ffb59e}
.line{display:flex;align-items:baseline;justify-content:center;gap:8px}
.hd{font-family:Georgia,serif;font-style:italic;font-weight:700;letter-spacing:.2px;position:relative}
.of{font-size:10.5px;font-weight:800;letter-spacing:2px;color:#a0a0a0}
.cd{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:2px;color:#ffb59e}
.cd i{display:block;width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,181,158,.5))}.cd i:last-child{transform:scaleX(-1)}
.cd b{color:#fff}
.vr{width:1px;height:40px;background:rgba(255,255,255,.15)}
</style></head><body style="width:900px"><div class="row">
<div class="col"><div class="tag">Now · built</div><div class="desc">The stat card sits fully above the bottom bar.</div>
<div class="ph"><img src="eighth-now.png"></div></div>
<div class="col"><div class="tag">A · compact</div><div class="desc">Big 8th as the headline. Beside it: of 12 with the countdown, and the gap to Sandy. The countdown joins that line instead of its own, so nothing below moves. Podium untouched.</div>
<div class="ph"><img src="eighth-top2.png"><div class="cap" style="padding:10px 0 17px;background:#131313">
<div style="display:flex;align-items:center;gap:12px"><span class="serif grad" style="font-size:50px">8th</span>
<div style="display:flex;flex-direction:column;gap:6px"><span class="of">OF 12<span style="opacity:.6">&nbsp;·&nbsp;</span><span style="color:#ffb59e">7 DAYS REMAINING</span></span><span class="hd" style="font-size:18px"><span class="sal">100</span> Behind Sandy M.</span></div></div>
</div><img src="eighth-bottom2.png"><img class="nav" src="eighth-nav.png"></div></div>
</div></body></html>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Copied from team-feed.tsx: post + postPhone, postHeader, postTitlePhone,
   noPhotoPanel / panelBigArt / PanelArt + SkyBackdrop (day), fcStats band,
   reactionRow. Only the walk card's layout differs between options. */
body{margin:0;background:#0b0b0b;font-family:Manrope,sans-serif;color:#fff;padding:20px 16px;display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.col{width:375px}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffb59e;margin:0 4px 10px;font-weight:800}
h2 span{color:rgba(255,255,255,.5);letter-spacing:0;text-transform:none;font-weight:600;margin-left:6px}
.page{background:#131313;padding:14px 16px;border-radius:18px}
.serif{font-family:Georgia,serif;font-style:italic;font-weight:700}
.post{position:relative;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:11px;
  background:#282828 radial-gradient(ellipse 70% 220px at 50% 0%,rgba(217,119,87,.17),rgba(217,119,87,.035) 60%,rgba(217,119,87,0) 85%) no-repeat border-box;
  border:1px solid;border-color:rgba(255,209,190,.26) rgba(255,209,190,.09) rgba(255,209,190,.03)}
.head{display:flex;align-items:center;gap:9px}
.av{width:36px;height:36px;border-radius:18px;border:1px solid rgba(255,181,158,.4);background:#5a4a40;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#ffb59e}
.name{font-size:15px}
.meta{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.meta b{color:#ffb59e;font-weight:600}
.title{font-size:16px;line-height:20px;color:rgba(255,255,255,.92);margin-top:-6px;padding:0 2px}
/* noPhotoPanel (brown) */
.panel{position:relative;border-radius:14px;overflow:hidden;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:#2d241f;background-image:radial-gradient(ellipse 90% 60% at 50% 40%,rgba(255,209,190,.10) 0%,rgba(19,19,19,0) 65%),linear-gradient(160deg,#231e1b 0%,#2d241f 55%,#3b2821 100%)}
.big{min-height:150px;justify-content:center}
.sky{background:linear-gradient(180deg,#3f6f93 0%,#6f9bb8 55%,#a9c2cf 100%)}
.sky::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:0}
.art svg{fill:rgba(255,255,255,.16)}
.cnt{position:relative;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#ffb59e}
.sky .cnt{color:#fff}
.body{position:relative;font-family:Georgia,serif;font-style:italic;font-size:13px;color:rgba(255,255,255,.75);text-align:center}
.sky .body{color:rgba(255,255,255,.92)}
.icons{display:flex;gap:2px}
.icons svg{fill:#ffb59e}
/* old footer */
.foot{display:flex;justify-content:space-between;align-items:center}
.stl{font-size:15px;font-weight:600}
.eff{display:flex;flex-direction:column;align-items:flex-end}
.effn{font-size:22px;line-height:24px}
.effu{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:9px;letter-spacing:.4px;color:rgba(255,255,255,.55);text-transform:uppercase;margin-top:1px}
.gold{background:linear-gradient(180deg,#ffe6b0,#f5b759);-webkit-background-clip:text;color:transparent}
/* fcStats */
.fc{border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#323232;display:flex;padding:10px 0}
.fc>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.fc>div+div{border-left:1px solid rgba(255,255,255,.08)}
.fl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.fv{font-size:16px;font-weight:700}
.fe{font-family:Georgia,serif;font-style:italic;font-size:19px}
/* reactions */
.re{display:flex;align-items:center;gap:16px;padding:0 2px;font-size:12.5px;font-weight:700;color:#e5e2e1}
.re span{display:flex;align-items:center;gap:5px}
.re i{font-style:normal;font-size:11.5px;font-weight:400;color:#a0a0a0}
.re .c{margin-left:auto}
.note{font-size:12px;color:rgba(255,255,255,.55);margin:10px 4px 0;line-height:17px}
</style></head><body>
<script>
const W=(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"${c?` style="fill:${c}"`:''}><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>`;
const star='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5e2e1" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const bolt='<svg width="15" height="15" viewBox="0 0 24 24" fill="#e5e2e1"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
const chat='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e5e2e1" stroke-width="2"><path d="M4 12a8 7 0 1 1 3 5.5L4 20l1-4a7 7 0 0 1-1-4z"/></svg>';
const head=(meta)=>`<div class="head"><div class="av">S</div><div><div class="name serif">Sandy</div><div class="meta">${meta}<b>The Hidden Leaf</b></div></div></div>`;
const react=`<div class="re"><span>${star}Respect <i>0</i></span><span>${bolt}Inspired <i>1</i></span><span class="c">${chat}<i>0</i></span></div>`;
const band=(n,time,eff)=>`<div class="fc"><div><div class="fl">Time</div><div class="fv">${time}</div></div><div><div class="fl">Distance</div><div class="fv">${n>1?'3.4 km':'1.2 km'}</div></div>${n>1?`<div><div class="fl">Walks</div><div class="fv">${n}</div></div>`:''}<div><div class="fl">Effort</div><div class="fv fe gold">${eff}</div></div></div>`;
const words=(n,t)=>`<div class="cnt">${n} ${n>1?'walks':'walk'}</div><div class="body">${t} of movement</div>`;
const card=(inner)=>`<div class="page"><div class="post">${inner}</div></div>`;
// Several walks: one figure per walk, up to five.
const row=(n,s,c)=>Array.from({length:Math.min(n,5)},()=>W(s,c)).join('');
const now=card(head('1 walk · 4w ago · ')+`<div class="panel">${W(28,'#ffb59e')}${words(1,'14 min')}</div><div class="foot"><div class="stl">14 min</div><div class="eff"><div class="effn serif gold">10.4</div><div class="effu">Effort</div></div></div>`+react);
const A=(n,t,time,eff)=>card(head('4w ago · ')+`<div class="title serif">${n>1?'Walks':'Walk'}</div><div class="panel"><div class="icons">${row(n,28)}</div>${words(n,t)}</div>`+band(n,time,eff)+react);
const B=(n,t,time,eff)=>card(head('4w ago · ')+`<div class="title serif">${n>1?'Walks':'Walk'}</div><div class="panel big sky"><div class="art">${row(n,n>1?(n>3?78:96):132)}</div>${words(n,t)}</div>`+band(n,time,eff)+react);
const cols=[
 ['Now','', now,'The day-of-walks card as it is: older layout, loose "14 min" line, no title.'],
 ['A · Matched, 1 walk','', A(1,'14 min','14:02','10.4'),'Title on its own line, the panel kept, the stat band from the other posts: Time, Distance, Effort.'],
 ['A · Matched, 3 walks','', A(3,'42 min','42:10','31.2'),'One small walking figure per walk (up to five). The band adds a Walks count. Distance is the walks added together.'],
 ['B · Sky panel, 1 walk','recommended', B(1,'14 min','14:02','10.4'),'The panel becomes the sky for the hour of the first walk, with the big faint figure, like Morning Run and every other post without a photo.'],
 ['B · Sky panel, 3 walks','recommended', B(3,'42 min','42:10','31.2'),'One big faint figure per walk, side by side, smaller as there are more (up to five).'],
];
document.write(cols.map(([t,r,c,n])=>`<div class="col"><h2>${t}${r?` <span>${r}</span>`:''}</h2>${c}<div class="note">${n}</div></div>`).join(''));
</script></body></html>
